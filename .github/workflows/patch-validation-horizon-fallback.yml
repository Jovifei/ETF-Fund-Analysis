name: patch-validation-horizon-fallback
on:
  push:
    branches: [fix/horizon-fallback-contract-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-fallback-contract-20260903
          fetch-depth: 0
      - name: Align forecast validation fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/validation_service.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from app.utils.hashing import stable_hash\n'
          import_line = 'from app.utils.horizons import DEFAULT_RESEARCH_HORIZONS\n'
          if import_line not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('hashing import anchor not unique')
              text = text.replace(anchor, anchor + import_line)
          replacements = {
              'cfg.get("horizons", [1, 5, 20])': 'cfg.get("horizons", DEFAULT_RESEARCH_HORIZONS)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'expected two validation horizon fallbacks, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q backend/app/services/forecast_service.py backend/app/services/validation_service.py
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-validation-horizon-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/validation_service.py .github/workflows/patch-validation-horizon-fallback.yml
          git commit -m 'fix: use shared research horizons in forecast validation'
          git push origin HEAD:fix/horizon-fallback-contract-20260903
