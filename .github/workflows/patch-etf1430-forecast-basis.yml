name: patch-etf1430-forecast-basis
on:
  push:
    branches: [fix/provisional-forecast-time-basis-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provisional-forecast-time-basis-20260903
          fetch-depth: 0
      - name: Add basis metadata to normal persisted ETF1430 forecasts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/etf_1430_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "similarity_distance": stored.similarity_distance, "calibration_status": status,\n                "diagnostics": stored.diagnostics_json or {},\n'''
          new = '''                "similarity_distance": stored.similarity_distance, "calibration_status": status,\n                "as_of_date": stored.as_of_date.isoformat(), "feature_basis": "settled_daily_bars",\n                "intraday_provisional_used": False,\n                "diagnostics": stored.diagnostics_json or {},\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one normal persisted forecast anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m compileall -q backend/app/services/etf_1430_service.py
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-etf1430-forecast-basis.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/etf_1430_service.py .github/workflows/patch-etf1430-forecast-basis.yml
          git commit -m 'fix: expose settled-daily basis in ETF1430 forecasts'
          git push origin HEAD:fix/provisional-forecast-time-basis-20260903
