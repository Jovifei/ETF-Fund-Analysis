name: apply-reviewed-final-workspace-edits
on:
  push:
    branches: ['feat/workspace-p0-p4-20260906']
    paths: ['.github/workflows/workspace-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/workspace-p0-p4-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-p0-p4-20260906
      - name: Apply only hash-verified data edits to the exact reviewed source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          allowed={'backend/Dockerfile','backend/app/workspace/api.py','backend/app/workspace/factor_diagnostics.py','backend/tests/test_workspace_bridge_client.py','bridge/etf_agent_bridge.py','codex/skills/fund-research/scripts/check_no_secrets.py','frontend/src/components/EtfChart.vue','frontend/src/lib/chartAdapter.ts','frontend/src/views/Overview.vue','frontend/src/views/Catalog.vue','frontend/src/views/Holdings.vue','frontend/e2e/workspace.spec.ts'}
          entries=json.loads(Path('scripts/workspace-final-edits.json').read_text())
          assert len(entries)==len(allowed) and {e['path'] for e in entries}==allowed
          verified=[]
          for entry in entries:
              p=Path(entry['path']); assert p.is_file() and not p.is_symlink()
              before=p.read_text(encoding='utf-8'); assert hashlib.sha256(before.encode()).hexdigest()==entry['base_sha256'], entry['path']
              after=before; previous=len(before)
              for edit in reversed(entry['edits']):
                  assert 0<=edit['start']<=edit['end']<=previous
                  previous=edit['start']
                  after=after[:edit['start']]+edit['text']+after[edit['end']:]
              assert hashlib.sha256(after.encode()).hexdigest()==entry['result_sha256'], entry['path']
              verified.append((p,after))
          for p,after in verified:p.write_text(after,encoding='utf-8')
          PY
          git diff --check
          git add backend/Dockerfile backend/app/workspace/api.py backend/app/workspace/factor_diagnostics.py backend/tests/test_workspace_bridge_client.py bridge/etf_agent_bridge.py codex/skills/fund-research/scripts/check_no_secrets.py frontend/src/components/EtfChart.vue frontend/src/lib/chartAdapter.ts frontend/src/views/Overview.vue frontend/src/views/Catalog.vue frontend/src/views/Holdings.vue frontend/e2e/workspace.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p4): finalize tested portfolio revisions, pairwise factors, bounded bridge and source hygiene'
          git push origin HEAD:refs/heads/feat/workspace-p0-p4-20260906
