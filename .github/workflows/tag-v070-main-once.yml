name: tag-v070-main-once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-v070-main-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify source and tests
        run: |
          grep -q 'version = "0.7.0"' pyproject.toml
          test -f backend/app/services/factor_analysis_service.py
          test -f docs/ROADMAP_V070.md
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q
          python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Tag and remove one-shot workflow
        run: |
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          if ! git rev-parse v0.7.0 >/dev/null 2>&1; then
            git tag -a v0.7.0 -m 'v0.7.0 forecast corridors and factor validation'
            git push origin v0.7.0
          fi
          rm -f .github/workflows/tag-v070-main-once.yml
          git add -A
          git commit -m 'chore(release): remove one-shot v0.7 tag workflow'
          git push origin HEAD:main
