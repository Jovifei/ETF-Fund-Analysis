name: apply-purged-expanding-walkforward

on:
  push:
    branches: [feat/purged-expanding-walkforward-20260903]
    paths:
      - '.github/workflows/apply-purged-expanding-walkforward.yml'
      - '.automation/purged_walk_forward/apply.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purged-expanding-walkforward
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply walk-forward config contract
        run: python .automation/purged_walk_forward/apply.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,market]'
      - name: Focused walk-forward tests
        run: |
          pytest -q \
            backend/tests/test_time_split.py \
            backend/tests/test_walk_forward_split.py \
            backend/tests/test_global_model_walk_forward.py \
            backend/tests/test_horizon_contract.py
      - name: Full unit and integration tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q backend/app scripts
      - name: Validate browser JavaScript
        run: |
          node --check backend/app/static/app.js
          node --check backend/app/static/decision_board_workbuddy.js
          node --check backend/app/static/kline_stabilization.js
      - name: Decision board JavaScript tests
        run: node --test backend/app/static/decision_board_workbuddy.test.js
      - name: Basic committed-secret scan
        run: python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Validate Alembic on a clean database
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_WALK_FORWARD_TEST_TOKEN_LONG_ENOUGH
          MARKET_PROVIDER: mock
          AUTO_CREATE_SCHEMA: 'false'
          DATABASE_URL: sqlite:////tmp/purged-walk-forward.sqlite3
        run: |
          rm -f /tmp/purged-walk-forward.sqlite3
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          alembic check
      - name: Validate shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck deploy/aliyun/*.sh scripts/*.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: CHANGE_ME_WALK_FORWARD_DATABASE_PASSWORD
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_WALK_FORWARD_PRIVATE_TOKEN_LONG_ENOUGH
        run: |
          cp deploy/.env.production.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_DB_PASSWORD/CHANGE_ME_WALK_FORWARD_DATABASE_PASSWORD/' .env
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARS/CHANGE_ME_WALK_FORWARD_PRIVATE_TOKEN_LONG_ENOUGH/' .env
          docker compose config >/dev/null
          rm -f .env
      - name: Build production image
        run: docker build -f backend/Dockerfile -t china-fund-decision:purged-walk-forward .
      - name: Smoke production image
        run: |
          docker network create walk-forward-smoke
          docker run -d --name walk-forward-smoke-db --network walk-forward-smoke \
            -e POSTGRES_DB=fund_decision -e POSTGRES_USER=fundapp \
            -e POSTGRES_PASSWORD=CHANGE_ME_WALK_FORWARD_DATABASE_PASSWORD \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec walk-forward-smoke-db pg_isready -U fundapp -d fund_decision >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name walk-forward-smoke-api --network walk-forward-smoke -p 127.0.0.1:18102:8000 \
            -e DATABASE_URL=postgresql+psycopg://fundapp:CHANGE_ME_WALK_FORWARD_DATABASE_PASSWORD@walk-forward-smoke-db:5432/fund_decision \
            -e APP_ENV=production -e AUTH_ENABLED=true -e AUTO_CREATE_SCHEMA=false \
            -e MARKET_PROVIDER=mock -e ALLOW_MOCK_FALLBACK=false \
            -e LLM_ENABLED=false -e ANALYSIS_ENABLED=false -e OCR_MODE=disabled \
            -e OCR_TRANSIENT_ROOT=/var/lib/china-fund-decision/ocr-transient \
            --tmpfs /var/lib/china-fund-decision/ocr-transient:size=64m,mode=0700,uid=10001,gid=10001 \
            china-fund-decision:purged-walk-forward \
            sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18102/api/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          docker logs walk-forward-smoke-api >&2 || true
          docker rm -f walk-forward-smoke-api walk-forward-smoke-db >/dev/null
          docker network rm walk-forward-smoke >/dev/null
          test "$ok" = "1"
      - name: Publish verified branch
        run: |
          rm -rf .automation/purged_walk_forward
          rm -f .github/workflows/apply-purged-expanding-walkforward.yml
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git add -A
          git commit -m 'feat(research): add purged expanding walk-forward validation'
          git push origin HEAD:feat/purged-expanding-walkforward-20260903
