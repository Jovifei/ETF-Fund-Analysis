name: apply-runtime-truth-ui

on:
  push:
    branches: [fix/runtime-truth-ops-hardening-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-truth-ops-hardening-20260903
      - name: Patch decision board runtime truth semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/static/decision_board_workbuddy.js')
          lines = path.read_text(encoding='utf-8').splitlines()

          def index_for(prefix: str) -> int:
              indexes = [index for index, line in enumerate(lines) if line.startswith(prefix)]
              if len(indexes) != 1:
                  raise SystemExit(f'expected one line starting {prefix!r}, got {len(indexes)}')
              return indexes[0]

          lines[index_for('const state = ')] = (
              "const state = {sessionActive:false, auth:{identifier:null, role:null}, board:null, "
              "horizon:1, filter:'', activeCode:null, poll:null, connectionError:false};"
          )

          lines[index_for('function forecastScore(')] = (
              "function forecastScore(row={},horizon=1){const item=forecastItem(row,horizon),"
              "conf=confidenceNumber(item),expected=Number(item?.expected_return),pup=Number(item?.p_up);"
              "if(conf!==null&&conf<40)return 50;if(!Number.isFinite(expected)&&!Number.isFinite(pup))return 50;"
              "const exp=Number.isFinite(expected)?clamp(50+expected*1200,10,90):50,"
              "prob=Number.isFinite(pup)?clamp(pup*100,10,90):50;let score=exp*.62+prob*.38;"
              "if(item?.calibration_status!=='calibrated')score=Math.min(score,75);return Math.round(score);}"
          )

          source_index = index_for('function sourceText(')
          lines[source_index + 1:source_index + 1] = [
              'const SNAPSHOT_MAX_AGE_MS=8*60*1000;',
              (
                  "function snapshotConnectionState(board={},nowMs=Date.now(),connectionError=false){"
                  "if(connectionError)return {label:'连接异常 · 显示最后快照',cls:'warn',live:false};"
                  "if(!board?.generated_at)return {label:'等待快照',cls:'muted',live:false};"
                  "const generated=Date.parse(board.generated_at);"
                  "if(!Number.isFinite(generated))return {label:'快照时间异常',cls:'warn',live:false};"
                  "const age=Number(nowMs)-generated;"
                  "if(age<-(5*60*1000))return {label:'快照时间异常',cls:'warn',live:false};"
                  "if(board.freshness!=='fresh')return {label:`快照 ${board.freshness||'unknown'}`,cls:'warn',live:false};"
                  "if(age>SNAPSHOT_MAX_AGE_MS)return {label:'快照已过期',cls:'warn',live:false};"
                  "return {label:'实时快照',cls:'ok',live:true};}"
              ),
          ]

          render_index = index_for('function renderMeta(')
          old_connection = (
              "$('#connectionBadge').textContent=b.freshness==='fresh'?'实时快照':'快照 '+(b.freshness||'unknown');"
              "$('#connectionBadge').className=`source-chip ${b.freshness==='fresh'?'ok':'warn'}`;"
          )
          new_connection = (
              "const connection=snapshotConnectionState(b,Date.now(),state.connectionError);"
              "$('#connectionBadge').textContent=connection.label;"
              "$('#connectionBadge').className=`source-chip ${connection.cls}`;"
          )
          if old_connection not in lines[render_index]:
              raise SystemExit('renderMeta connection target not found')
          lines[render_index] = lines[render_index].replace(old_connection, new_connection, 1)

          lines[index_for('async function loadBoard(')] = (
              "async function loadBoard(silent=false){try{state.board=await api(`"
              "/api/decision-board?horizon=${state.horizon}`);state.connectionError=false;renderAll();}"
              "catch(err){state.connectionError=true;if(state.board)renderMeta();"
              "if(!silent&&err.message!=='unauthorized')toast(`读取失败：${err.message}`,5000);}}"
          )

          export_index = index_for('globalThis.WorkBuddyDecisionBoard=')
          export_line = lines[export_index]
          if 'snapshotConnectionState' not in export_line:
              if not export_line.endswith('confidenceBand});'):
                  raise SystemExit('UI export target not found')
              export_line = export_line.replace('confidenceBand});', 'confidenceBand,snapshotConnectionState});')
          lines[export_index] = export_line

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          node --check backend/app/static/decision_board_workbuddy.js
      - name: Commit patched UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/static/decision_board_workbuddy.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): expire stale snapshots and neutralize ignored forecasts'
            git push origin HEAD:fix/runtime-truth-ops-hardening-20260903
          fi
