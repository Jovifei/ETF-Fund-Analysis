name: patch-probe-path-temp

on:
  push:
    branches: [fix/reference-board-parity-final-safe]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[probe-path-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-parity-final-safe
      - name: Keep weak repair as probe while bearish continuation remains reduce
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/signal_grade_service.py')
          s=p.read_text(encoding='utf-8')
          old='    structure_ok = ma["kind"] == "bull" or macd["kind"] in {"gold", "approach_gold", "bull_cont"}'
          new='    structure_ok = ma["kind"] == "bull" or macd["kind"] in {"gold", "bull_cont"}'
          if old not in s: raise SystemExit('missing structure_ok anchor')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('backend/tests/test_signal_grade.py')
          s=p.read_text(encoding='utf-8')
          old='''            macd_hist=-0.02,\n            macd_dif=-0.02,\n            macd_dea=-0.01,\n        ),\n        pct_change=-0.01,\n        previous={"macd_hist": -0.01, "macd_dif": -0.01, "macd_dea": -0.005, "kdj_k": 44, "kdj_d": 39},'''
          new='''            macd_hist=-0.0005,\n            macd_dif=-0.0200,\n            macd_dea=-0.0195,\n        ),\n        pct_change=-0.01,\n        previous={"macd_hist": -0.0010, "macd_dif": -0.0210, "macd_dea": -0.0200, "kdj_k": 44, "kdj_d": 39},'''
          if old not in s: raise SystemExit('missing probe fixture anchor')
          s=s.replace(old,new,1)
          s += '''\n\ndef test_approach_gold_is_probe_when_ma_not_bull():\n    values = _base_values(\n        volume_ratio=1.0, kdj_j=45, kdj_k=50, kdj_d=45,\n        ma5=2.10, ma10=2.20, ma20=2.15, ma30=2.12,\n        macd_hist=-0.0005, macd_dif=-0.0200, macd_dea=-0.0195,\n    )\n    row = classify_row(\n        values, pct_change=-0.005,\n        previous={"macd_hist": -0.0010, "macd_dif": -0.0210, "macd_dea": -0.0200, "kdj_k": 48, "kdj_d": 44},\n        cfg={"j_add_cap":90,"j_overbought":100,"j_high":90,"j_low":20,"volume_expand":1.15,"volume_contract":0.90,"stall_return":0.002,"macd_approach_hist":0.0008},\n    )\n    assert row["macd"]["kind"] == "approach_gold"\n    assert row["macd"]["label"] == "将叉"\n    assert row["grade"] == "可试探"\n'''
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/services/signal_grade_service.py backend/tests/test_signal_grade.py
          git commit -m "fix: preserve weak-repair probe path [probe-path-fixed]"
          git push origin HEAD:fix/reference-board-parity-final-safe
