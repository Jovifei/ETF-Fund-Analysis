name: patch-reference-boundaries-temp

on:
  push:
    branches: [fix/reference-board-signal-consistency-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reference-boundaries-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-signal-consistency-v2
      - name: Align exact J and volume boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/signal_grade_service.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"""Read-only ETF signal grading view (signal-grade-v0.1.0).', '"""Read-only ETF signal grading view (company-reference grading).', 1)
          old='    elif j >= float(cfg["j_overbought"]):\n        kind, label, note = "overbought", "超买", "短期过热 · 回调风险"'
          new='    elif j > float(cfg["j_overbought"]):\n        kind, label, note = "overbought", "超买", "短期过热 · 回调风险"'
          if old not in s: raise SystemExit('missing J>100 anchor')
          s=s.replace(old,new,1)
          old='    elif j <= float(cfg["j_low"]):\n        kind, label, note = "low", "低位", "超卖 · 反弹概率升高"'
          new='    elif j < float(cfg["j_low"]):\n        kind, label, note = "low", "低位", "超卖 · 反弹概率升高"'
          if old not in s: raise SystemExit('missing J<20 anchor')
          s=s.replace(old,new,1)
          s=s.replace('float(cfg.get("volume_expand", 1.35)), float(cfg.get("volume_contract", 0.85))', 'float(cfg.get("volume_expand", 1.15)), float(cfg.get("volume_contract", 0.90))', 1)
          p.write_text(s,encoding='utf-8')

          p=Path('backend/tests/test_signal_grade.py')
          s=p.read_text(encoding='utf-8')
          s += '''\n\ndef test_company_reference_kdj_boundaries_are_exact():\n    from app.services.signal_grade_service import classify_kdj\n    cfg = {"j_overbought": 100, "j_high": 90, "j_low": 20}\n    def item(j):\n        return classify_kdj({"kdj_j": j, "kdj_k": 60, "kdj_d": 50}, None, cfg)\n    assert item(19.9)["kind"] == "low"\n    assert item(20)["kind"] == "healthy"\n    assert item(89.9)["kind"] == "healthy"\n    assert item(90)["kind"] == "high"\n    assert item(100)["kind"] == "high"\n    assert item(100.1)["kind"] == "overbought"\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('backend/app/static/decision_board_workbuddy.js')
          s=p.read_text(encoding='utf-8')
          old="$('#boardArea').innerHTML=GROUPS.map(group=>{const members=list.filter(row=>(row.grade||'数据异常')===group);"
          new="$('#boardArea').innerHTML=GROUPS.filter(group=>group!=='数据异常'||list.some(row=>(row.grade||'数据异常')==='数据异常')).map(group=>{const members=list.filter(row=>(row.grade||'数据异常')===group);"
          if old not in s: raise SystemExit('missing group render anchor')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/services/signal_grade_service.py backend/tests/test_signal_grade.py backend/app/static/decision_board_workbuddy.js
          git commit -m "fix: match exact company reference boundaries [reference-boundaries-fixed]"
          git push origin HEAD:fix/reference-board-signal-consistency-v2
