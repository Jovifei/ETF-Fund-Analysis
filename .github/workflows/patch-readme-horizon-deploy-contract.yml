name: patch-readme-horizon-deploy-contract
on:
  push:
    branches: [fix/horizon-fallback-contract-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-fallback-contract-20260903
          fetch-depth: 0
      - name: Align README contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '- 1/5/20 日终点收益、终点收盘区间、未来路径支撑/压力区和触及概率；继续标记 `not_calibrated`。'
          new = '- 1/3/5/10 交易日终点收益、终点收盘区间、未来路径支撑/压力区和触及频率；未完成前向校准时继续标记 `not_calibrated`。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old horizon README line, found {text.count(old)}')
          text = text.replace(old, new)
          pattern = re.compile(r'上线前先备份，再按 .*?执行 `alembic upgrade head`；', re.S)
          replacement = '上线前先备份，并执行 `alembic upgrade head`；随后用 `alembic current` 与 `alembic check` 验证数据库处于仓库当前唯一 head 且没有待生成迁移；'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one hard-coded migration chain paragraph, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README fix and remove temporary workflow
        run: |
          rm .github/workflows/patch-readme-horizon-deploy-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/patch-readme-horizon-deploy-contract.yml
          git commit -m 'docs: align README with current horizon and migration contracts'
          git push origin HEAD:fix/horizon-fallback-contract-20260903
