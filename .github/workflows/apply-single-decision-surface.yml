name: apply-single-decision-surface

on:
  push:
    branches: [fix/single-etf-decision-surface-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-etf-decision-surface-20260903
      - name: Apply canonical UI and forecast patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{label}: start marker missing')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return text[:i] + replacement + text[j:]

          # 1) One user-facing page. Legacy/K-line page paths remain compatibility redirects only.
          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''@app.get("/legacy", include_in_schema=False)\ndef legacy() -> FileResponse:\n    return FileResponse(STATIC_DIR / "index.html", media_type="text/html; charset=utf-8")''',
              '''@app.get("/legacy", include_in_schema=False)\ndef legacy() -> RedirectResponse:\n    return RedirectResponse(url="/", status_code=307)''',
              'legacy route',
          )
          text = replace_once(
              text,
              '''@app.get("/workbench/kline", include_in_schema=False)\ndef kline_stabilization() -> FileResponse:\n    return FileResponse(STATIC_DIR / "kline_stabilization.html", media_type="text/html; charset=utf-8")''',
              '''@app.get("/workbench/kline", include_in_schema=False)\ndef kline_stabilization() -> RedirectResponse:\n    return RedirectResponse(url="/", status_code=307)''',
              'kline route',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('backend/app/static/decision_board_workbuddy.html')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '      <a class="ghost-link" href="/legacy">完整系统</a>\n',
              '      <span class="source-chip muted">统一决策台</span>\n',
              'legacy header link',
          )
          text = replace_once(
              text,
              '      <div>预测：历史相似形态研究基线 · conf 为样本一致度/支持度，不等于未来准确率；not_calibrated 时必须视为研究结果。</div>',
              '      <div>预测：p_up 在未校准时表示历史相似样本加权上涨占比，不等同未来概率；只有 calibration_status=calibrated 才显示为上涨概率。</div>',
              'forecast footer semantics',
          )
          path.write_text(text, encoding='utf-8')

          # 2) Main board: probability wording follows calibration state; explanatory forecast score is evidence-shrunk.
          path = Path('backend/app/static/decision_board_workbuddy.js')
          text = path.read_text(encoding='utf-8')
          old_forecast = "function forecastScore(row={},horizon=1){const item=forecastItem(row,horizon),conf=confidenceNumber(item),expected=Number(item?.expected_return),pup=Number(item?.p_up);if(conf!==null&&conf<40)return 50;if(!Number.isFinite(expected)&&!Number.isFinite(pup))return 50;const exp=Number.isFinite(expected)?clamp(50+expected*1200,10,90):50,prob=Number.isFinite(pup)?clamp(pup*100,10,90):50;let score=exp*.62+prob*.38;if(item?.calibration_status!=='calibrated')score=Math.min(score,75);return Math.round(score);}"
          new_forecast = "function forecastScore(row={},horizon=1){const item=forecastItem(row,horizon),conf=confidenceNumber(item),expected=Number(item?.expected_return),pup=Number(item?.p_up);if(conf===null||conf<40)return 50;if(!Number.isFinite(expected)&&!Number.isFinite(pup))return 50;const exp=Number.isFinite(expected)?clamp(50+expected*1200,10,90):50,prob=Number.isFinite(pup)?clamp(pup*100,10,90):50,raw=exp*.62+prob*.38;let evidence=clamp((conf-40)/40,0,1);if(item?.calibration_status!=='calibrated')evidence*=.65;return Math.round(50+(raw-50)*evidence);}"
          text = replace_once(text, old_forecast, new_forecast, 'workbuddy forecast score')
          start = 'function detailHtml(detail){'
          end = 'function drawChart(detail){'
          replacement = '''function forecastProbabilityLabel(item={}){return item?.calibration_status==='calibrated'?'上涨概率':'历史相似样本上涨占比';}\nfunction detailHtml(detail){const scoring=scoreRow(detail,state.horizon),kd=kdjInterpret(detail?.kdj),levels=detail?.support_resistance||{},src=sourceText(detail),forecasts=HORIZONS.map(h=>{const f=forecastItem(detail,h),c=confidenceNumber(f),probLabel=forecastProbabilityLabel(f);return `<div class="detail-metric"><span>${h}日预测</span><b>${pct(f?.expected_return)} · ${esc(probLabel)} ${numeric(f?.p_up)?`${Math.round(Number(f.p_up)*100)}%`:'—'}</b><small>conf ${c===null?'—':Math.round(c)} · ${esc(f?.calibration_status||'not_calibrated')}</small></div>`;}).join('');return `${detailScoreHtml(scoring)}<div class="detail-block"><h3>指标解读</h3><div class="detail-grid">${indicator('MA',detail?.ma?.label||'—',detail?.ma?.values_text||'')}${indicator('MACD',detail?.macd?.label||'—',`DIF ${fmt(detail?.macd?.dif,4)} / DEA ${fmt(detail?.macd?.dea,4)}`)}${indicator('KDJ',kd.label,kd.note)}${indicator('RSI',`RSI ${fmt(detail?.rsi?.value,1)}`,detail?.rsi?.label||'')}${indicator('量能',detail?.volume?.label||'—',`量比 ${fmt(detail?.volume?.ratio,2)}`)}${indicator('TD9',detail?.td?.label||'—','节奏参考')}</div></div><div class="detail-block"><h3>1 / 3 / 5 / 10 日研究预测</h3><div class="detail-grid">${forecasts}</div></div><div class="detail-block"><h3>支撑 / 压力 / 缠论近似 / 数据源</h3><div class="detail-grid"><div class="detail-metric"><span>最近支撑</span><b>${levelText(levels?.nearest_support)}</b></div><div class="detail-metric"><span>最近压力</span><b>${levelText(levels?.nearest_resistance)}</b></div><div class="detail-metric"><span>缠论近似</span><b>${esc(detail?.chan?.label||'—')}</b><small>${esc(detail?.chan?.detail||'')}</small></div><div class="detail-metric"><span>数据源</span><b>${esc(src.source)}</b><small>${esc(timeText(src.time))} · ${src.verified?'已验证':'未验证'}</small></div></div></div>`;}\n'''
          text = replace_between(text, start, end, replacement, 'detail probability wording')
          text = replace_once(
              text,
              'globalThis.WorkBuddyDecisionBoard=Object.freeze({api,ensureSession,loginAccount,logoutAccount,scoreRow,kdjInterpret,maScore,macdScore,rsiScore,tdScore,volumeScore,structureScore,forecastScore,dataScore,scoreClass,scoreLabel,pct,deltaArrow,confidenceBand,snapshotConnectionState});',
              'globalThis.WorkBuddyDecisionBoard=Object.freeze({api,ensureSession,loginAccount,logoutAccount,scoreRow,kdjInterpret,maScore,macdScore,rsiScore,tdScore,volumeScore,structureScore,forecastScore,forecastProbabilityLabel,dataScore,scoreClass,scoreLabel,pct,deltaArrow,confidenceBand,snapshotConnectionState});',
              'workbuddy exports',
          )
          path.write_text(text, encoding='utf-8')

          # 3) 14:30 compatibility API becomes a read-only projection of canonical current decision + persisted forecasts.
          path = Path('backend/app/services/etf_1430_service.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '    DailyBar,\n    ForecastSnapshot,', '    DailyBar,\n    DecisionBoardSnapshot,\n    ForecastSnapshot,', 'decision snapshot import')
          text = replace_once(text, 'from app.services.forecast_service import similarity_forecast\nfrom app.utils.feature_store import build_feature_frame, feature_columns_for_horizon\n', 'from app.services.signal_grade_service import SignalGradeService\nfrom app.utils.current_decision import resolve_current_decision\nfrom app.utils.feature_store import build_feature_frame\n', 'canonical imports')

          method_start = '    def _dynamic_forecasts(\n'
          method_end = '    def _news('
          new_methods = '''    def _persisted_forecasts(\n        self, persisted: dict[int, ForecastSnapshot]\n    ) -> dict[int, dict[str, Any]]:\n        \"\"\"Project the same persisted forecasts consumed by the canonical decision board.\n\n        `p_up` is retained as a compatibility field. Until a snapshot is explicitly\n        calibrated it is a weighted historical-neighbor up-frequency, not a claim\n        about a calibrated future probability.\n        \"\"\"\n        result: dict[int, dict[str, Any]] = {}\n        for horizon_value in self.config.get(\"forecast_horizons\", [1, 3, 5, 10]):\n            horizon = int(horizon_value)\n            stored = persisted.get(horizon)\n            if stored is None:\n                result[horizon] = {\n                    \"horizon\": horizon,\n                    \"source\": \"unavailable\",\n                    \"model_version\": None,\n                    \"p_up\": None,\n                    \"historical_up_frequency\": None,\n                    \"up_probability\": None,\n                    \"p_up_semantics\": \"unavailable\",\n                    \"probability_calibrated\": False,\n                    \"expected_return\": None,\n                    \"q10\": None, \"q50\": None, \"q90\": None,\n                    \"terminal_price_q10\": None, \"terminal_price_q50\": None, \"terminal_price_q90\": None,\n                    \"path_low_price_q10\": None, \"path_low_price_q50\": None, \"path_low_price_q90\": None,\n                    \"path_high_price_q10\": None, \"path_high_price_q50\": None, \"path_high_price_q90\": None,\n                    \"support_touch_probability\": None, \"resistance_touch_probability\": None,\n                    \"sample_count\": 0, \"confidence\": 0.0, \"similarity_distance\": None,\n                    \"calibration_status\": \"not_calibrated\",\n                    \"diagnostics\": {\"reason\": \"persisted_forecast_missing\"},\n                }\n                continue\n            calibration_status = str(stored.calibration_status or \"not_calibrated\")\n            calibrated = calibration_status == \"calibrated\"\n            result[horizon] = {\n                \"horizon\": horizon,\n                \"source\": \"persisted_forecast_snapshot\",\n                \"model_version\": stored.model_version,\n                \"p_up\": stored.p_up,\n                \"historical_up_frequency\": None if calibrated else stored.p_up,\n                \"up_probability\": stored.p_up if calibrated else None,\n                \"p_up_semantics\": \"calibrated_up_probability\" if calibrated else \"weighted_historical_neighbor_up_frequency\",\n                \"probability_calibrated\": calibrated,\n                \"expected_return\": stored.expected_return,\n                \"q10\": stored.q10, \"q50\": stored.q50, \"q90\": stored.q90,\n                \"terminal_price_q10\": stored.terminal_price_q10,\n                \"terminal_price_q50\": stored.terminal_price_q50,\n                \"terminal_price_q90\": stored.terminal_price_q90,\n                \"path_low_price_q10\": stored.path_low_price_q10,\n                \"path_low_price_q50\": stored.path_low_price_q50,\n                \"path_low_price_q90\": stored.path_low_price_q90,\n                \"path_high_price_q10\": stored.path_high_price_q10,\n                \"path_high_price_q50\": stored.path_high_price_q50,\n                \"path_high_price_q90\": stored.path_high_price_q90,\n                \"support_touch_probability\": stored.support_touch_probability,\n                \"resistance_touch_probability\": stored.resistance_touch_probability,\n                \"sample_count\": stored.sample_count,\n                \"confidence\": stored.confidence,\n                \"similarity_distance\": stored.similarity_distance,\n                \"calibration_status\": calibration_status,\n                \"diagnostics\": stored.diagnostics_json or {},\n            }\n        return result\n\n    @staticmethod\n    def _latest_decision_rows(db: Session) -> tuple[str | None, dict[str, dict[str, Any]]]:\n        snapshot = db.scalar(\n            select(DecisionBoardSnapshot)\n            .order_by(DecisionBoardSnapshot.generated_at.desc(), DecisionBoardSnapshot.id.desc())\n            .limit(1)\n        )\n        if snapshot is None:\n            return None, {}\n        payload = snapshot.payload_json if isinstance(snapshot.payload_json, dict) else {}\n        rows = payload.get(\"rows\") if isinstance(payload, dict) else []\n        mapped: dict[str, dict[str, Any]] = {}\n        for row in rows or []:\n            if isinstance(row, dict):\n                code = str(row.get(\"ts_code\") or \"\").strip().upper()\n                if code:\n                    mapped[code] = row\n        return snapshot.snapshot_id, mapped\n\n    def _canonical_decisions(\n        self, db: Session, instruments: list[Instrument]\n    ) -> tuple[str | None, dict[str, dict[str, Any]]]:\n        snapshot_id, board_rows = self._latest_decision_rows(db)\n        codes = {str(item.ts_code).strip().upper() for item in instruments}\n        missing = {code for code in codes if not (board_rows.get(code) or {}).get(\"grade\")}\n        grade_payload = SignalGradeService(self.settings).build(db) if missing else {}\n        grade_rows = {\n            str(row.get(\"ts_code\") or \"\").strip().upper(): row\n            for row in grade_payload.get(\"rows\", [])\n            if str(row.get(\"ts_code\") or \"\").strip().upper() in missing\n        }\n        latest_signals: dict[int, SignalSnapshot] = {}\n        for snapshot in db.scalars(select(SignalSnapshot).order_by(SignalSnapshot.as_of_time.asc())).all():\n            latest_signals[snapshot.instrument_id] = snapshot\n        result: dict[str, dict[str, Any]] = {}\n        for instrument in instruments:\n            code = str(instrument.ts_code).strip().upper()\n            board = board_rows.get(code)\n            fallback = grade_rows.get(code)\n            production = latest_signals.get(instrument.id)\n            resolved = resolve_current_decision(\n                decision_board_grade=(board or {}).get(\"grade\"),\n                signal_grade_fallback=(fallback or {}).get(\"grade\"),\n                production_signal_state=production.state if production is not None else None,\n            )\n            result[code] = {\n                \"state\": resolved.state if resolved is not None else \"数据异常\",\n                \"source\": resolved.source if resolved is not None else \"unavailable\",\n                \"canonical\": resolved.canonical if resolved is not None else False,\n                \"decision_board_grade\": (board or {}).get(\"grade\"),\n                \"signal_grade_fallback\": (fallback or {}).get(\"grade\"),\n                \"production_signal_state\": production.state if production is not None else None,\n            }\n        return snapshot_id, result\n\n'''
          text = replace_between(text, method_start, method_end, new_methods, 'forecast/canonical methods')

          # Remove the second rule-based action engine completely.
          text = replace_between(text, '    def _action(', '    def _scenario_candles(', '    def _scenario_candles(', 'legacy action engine')

          # Evidence-aware explanatory forecast score. This score never determines canonical action.
          score_start = '    @staticmethod\n    def _score_forecast('
          score_end = '    @staticmethod\n    def _score_news('
          score_replacement = '''    @staticmethod\n    def _score_forecast(forecasts: dict[int, dict[str, Any]]) -> float:\n        weights = {1: 0.35, 3: 0.25, 5: 0.23, 10: 0.17}\n        total = 0.0\n        used = 0.0\n        for horizon, weight in weights.items():\n            item = forecasts.get(horizon, {})\n            p_up = _finite(item.get(\"p_up\"))\n            expected = _finite(item.get(\"expected_return\"))\n            confidence = _finite(item.get(\"confidence\"))\n            if confidence is not None and confidence <= 1:\n                confidence *= 100\n            if p_up is None and expected is None:\n                continue\n            raw = 50.0\n            if p_up is not None:\n                raw += (p_up - 0.5) * 70\n            if expected is not None:\n                raw += clamp(expected * 450, -20, 20)\n            if confidence is None or confidence < 40:\n                value = 50.0\n            else:\n                evidence = clamp((confidence - 40) / 40, 0, 1)\n                if item.get(\"calibration_status\") != \"calibrated\":\n                    evidence *= 0.65\n                value = 50.0 + (clamp(raw, 0, 100) - 50.0) * evidence\n            total += clamp(value, 0, 100) * weight\n            used += weight\n        return round(total / used, 2) if used else 50.0\n\n'''
          text = replace_between(text, score_start, score_end, score_replacement, 'forecast explanatory score')

          old_sig = '    def _row(self, db: Session, instrument: Instrument, *, include_chart: bool = False, user_id: int | None = None) -> dict[str, Any]:'
          new_sig = '    def _row(self, db: Session, instrument: Instrument, *, include_chart: bool = False, user_id: int | None = None, current_decision: dict[str, Any] | None = None, decision_snapshot_id: str | None = None) -> dict[str, Any]:'
          text = replace_once(text, old_sig, new_sig, 'row signature')
          text = replace_once(text, '        forecasts = self._dynamic_forecasts(frame, persisted)\n', '        forecasts = self._persisted_forecasts(persisted)\n        if current_decision is None:\n            decision_snapshot_id, decision_map = self._canonical_decisions(db, [instrument])\n            current_decision = decision_map.get(str(instrument.ts_code).strip().upper())\n', 'row persisted forecasts')
          text = replace_once(text, '        rr = _finite(structure_metrics.get("risk_reward"))\n        action = self._action(score, rr, holding, values)\n', '        rr = _finite(structure_metrics.get("risk_reward"))\n        action = str((current_decision or {}).get("state") or "数据异常")\n', 'canonical action assignment')
          text = replace_once(text, '            "score": round(score, 2),\n            "action": action,\n', '            "score": round(score, 2),\n            "research_score": round(score, 2),\n            "score_semantics": "explanatory_ranking_only_not_current_decision",\n            "action": action,\n            "action_source": (current_decision or {}).get("source", "unavailable"),\n            "action_canonical": bool((current_decision or {}).get("canonical", False)),\n            "decision_snapshot_id": decision_snapshot_id,\n            "current_decision": current_decision or {"state": action, "source": "unavailable", "canonical": False},\n', 'result canonical metadata')

          old_summary = '''        rows = [self._row(db, instrument, include_chart=False, user_id=user_id) for instrument in instruments]\n        rows.sort(key=lambda item: (float(item["score"]), item["ts_code"]), reverse=True)'''
          new_summary = '''        decision_snapshot_id, decisions = self._canonical_decisions(db, instruments)\n        rows = [\n            self._row(\n                db, instrument, include_chart=False, user_id=user_id,\n                current_decision=decisions.get(str(instrument.ts_code).strip().upper()),\n                decision_snapshot_id=decision_snapshot_id,\n            )\n            for instrument in instruments\n        ]\n        rows.sort(key=lambda item: (float(item["research_score"]), item["ts_code"]), reverse=True)'''
          text = replace_once(text, old_summary, new_summary, 'summary canonical map')
          text = replace_once(text, '            "historical_1430_backtest": "not_qualified",\n            "counts": dict(counts),\n', '            "historical_1430_backtest": "not_qualified",\n            "current_decision_contract": "decision_board_snapshot_then_signal_grade_then_signal_snapshot_last_resort",\n            "decision_snapshot_id": decision_snapshot_id,\n            "score_semantics": "explanatory_ranking_only_not_current_decision",\n            "counts": dict(counts),\n', 'summary decision contract')
          text = replace_once(text, '                "本页只生成研究候选，不连接券商、不创建订单。",\n', '                "兼容API的 action 与主页共用唯一 current decision；research_score 只解释和排序，不生成第二套买卖结论。",\n                "本页只生成研究结果，不连接券商、不创建订单。",\n', 'summary disclaimer')
          old_detail = '''        instrument = db.scalar(select(Instrument).where(Instrument.ts_code == ts_code.upper()))\n        return self._row(db, instrument, include_chart=True, user_id=user_id) if instrument is not None else None'''
          new_detail = '''        instrument = db.scalar(select(Instrument).where(Instrument.ts_code == ts_code.upper()))\n        if instrument is None:\n            return None\n        decision_snapshot_id, decisions = self._canonical_decisions(db, [instrument])\n        return self._row(\n            db, instrument, include_chart=True, user_id=user_id,\n            current_decision=decisions.get(str(instrument.ts_code).strip().upper()),\n            decision_snapshot_id=decision_snapshot_id,\n        )'''
          text = replace_once(text, old_detail, new_detail, 'detail canonical map')
          path.write_text(text, encoding='utf-8')

          # 4) Update existing workbench contract: compatibility API must expose canonical five-grade only.
          path = Path('backend/tests/test_etf_1430_workbench.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    assert row["action"] in {"买入候选", "可试探", "持有/观察", "减仓候选", "回避"}\n',
              '    assert row["action"] in {"可加仓", "可入场", "可试探", "观望", "减仓", "数据异常"}\n    assert row["action_source"] in {"decision_board_snapshot", "signal_grade_fallback", "signal_snapshot_last_resort", "unavailable"}\n    assert row["score_semantics"] == "explanatory_ranking_only_not_current_decision"\n',
              'workbench action contract',
          )
          text = replace_once(
              text,
              '    assert all(item["calibration_status"] == "not_calibrated" for item in row["forecasts"].values())\n',
              '    assert all(item["source"] in {"persisted_forecast_snapshot", "unavailable"} for item in row["forecasts"].values())\n    assert not any(item["source"] == "dynamic_similarity_research" for item in row["forecasts"].values())\n    for item in row["forecasts"].values():\n        if item["source"] == "persisted_forecast_snapshot":\n            assert item["p_up_semantics"] in {"weighted_historical_neighbor_up_frequency", "calibrated_up_probability"}\n',
              'workbench forecast contract',
          )
          text = replace_once(
              text,
              '        page = client.get("/workbench/1430", follow_redirects=False)\n        assert page.status_code in {307, 308}\n        assert page.headers["location"] == "/"\n',
              '        for route in ("/workbench/1430", "/workbench/kline", "/legacy"):\n            page = client.get(route, follow_redirects=False)\n            assert page.status_code in {307, 308}\n            assert page.headers["location"] == "/"\n        home = client.get("/")\n        assert home.status_code == 200\n        assert 'href="/legacy"' not in home.text\n        assert "统一决策台" in home.text\n',
              'single page route contract',
          )
          path.write_text(text, encoding='utf-8')

          # 5) Extend browser contract for probability wording and evidence shrinkage.
          path = Path('backend/app/static/decision_board_workbuddy.test.js')
          text = path.read_text(encoding='utf-8')
          text += '''\ntest('uncalibrated p_up is labelled as historical neighbor frequency',()=>{const ui=load();assert.equal(ui.forecastProbabilityLabel({calibration_status:'not_calibrated'}),'历史相似样本上涨占比');assert.equal(ui.forecastProbabilityLabel({calibration_status:'calibrated'}),'上涨概率');});\ntest('forecast score shrinks weak uncalibrated evidence toward neutral',()=>{const ui=load();const weak={forecasts:{'1':{expected_return:.03,p_up:.8,confidence:55,calibration_status:'not_calibrated'}}};const strong={forecasts:{'1':{expected_return:.03,p_up:.8,confidence:80,calibration_status:'calibrated'}}};assert.ok(Math.abs(ui.forecastScore(weak,1)-50)<Math.abs(ui.forecastScore(strong,1)-50));assert.equal(ui.forecastScore({forecasts:{'1':{expected_return:.08,p_up:.9,confidence:39,calibration_status:'not_calibrated'}}},1),50);});\n'''
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/apply-single-decision-surface.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/main.py backend/app/services/etf_1430_service.py backend/app/static/decision_board_workbuddy.html backend/app/static/decision_board_workbuddy.js backend/app/static/decision_board_workbuddy.test.js backend/tests/test_etf_1430_workbench.py
          git commit -m 'fix: enforce one ETF decision surface and forecast source'
          git push origin HEAD:fix/single-etf-decision-surface-20260903
