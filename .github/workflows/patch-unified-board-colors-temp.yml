name: patch-unified-board-colors-temp

on:
  push:
    branches:
      - feat/unified-etf-decision-row-board

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[row-colors-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-etf-decision-row-board
      - name: Match screenshot direction colors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/static/decision_board_workbuddy.css')
          text = path.read_text(encoding='utf-8')
          text = text.replace('.delta-arrow.up{color:var(--red)}.delta-arrow.down{color:var(--green)}', '.delta-arrow.up{color:var(--green)}.delta-arrow.down{color:var(--red)}')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/static/decision_board_workbuddy.css
          git commit -m "fix(ui): match screenshot relative-direction colors [row-colors-fixed]"
          git push origin HEAD:feat/unified-etf-decision-row-board
