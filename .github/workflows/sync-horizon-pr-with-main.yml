name: sync-horizon-pr-with-main
on:
  push:
    branches: [fix/horizon-fallback-contract-20260903]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-fallback-contract-20260903
          fetch-depth: 0
      - name: Merge latest main without dropping horizon changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/sync-horizon-pr-with-main.yml
          git add .github/workflows/sync-horizon-pr-with-main.yml
          git commit -m 'chore: remove temporary branch sync workflow'
          git push origin HEAD:fix/horizon-fallback-contract-20260903
