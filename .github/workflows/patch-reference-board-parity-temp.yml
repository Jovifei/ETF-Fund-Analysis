name: patch-reference-board-parity-temp

on:
  push:
    branches:
      - fix/reference-board-parity-20260903-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reference-parity-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-parity-20260903-final
          fetch-depth: 0
      - name: Unify current conclusions and reference thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          strategy = Path('config/strategy.json')
          text = strategy.read_text(encoding='utf-8')
          text = text.replace('"signal_center_version": "signal-center-v0.1.0"', '"signal_center_version": "signal-center-v0.2.0"')
          text = text.replace('"signal_grade_version": "signal-grade-v0.2.0"', '"signal_grade_version": "signal-grade-v0.3.0"')
          text = text.replace('"volume_expand": 1.35', '"volume_expand": 1.15')
          text = text.replace('"volume_contract": 0.85', '"volume_contract": 0.9')
          strategy.write_text(text, encoding='utf-8')

          service = Path('backend/app/services/signal_center_service.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              'from app.models import IndicatorSnapshot, Instrument, NewsItem, SignalSnapshot',
              'from app.models import DecisionBoardSnapshot, IndicatorSnapshot, Instrument, NewsItem, SignalSnapshot'
          )
          text = text.replace(
              'OPPORTUNITY_STATES = frozenset({"可入场", "可试探", "加仓", "小幅加仓"})\nRISK_STATES = frozenset({"减仓", "风险观察", "数据异常"})',
              'OPPORTUNITY_STATES = frozenset({"可加仓", "可入场", "可试探", "加仓", "小幅加仓"})\nRISK_STATES = frozenset({"观望", "减仓", "风险观察", "数据异常"})\nCANONICAL_OPPORTUNITY_GRADES = frozenset({"可加仓", "可入场", "可试探"})\nCANONICAL_RISK_GRADES = frozenset({"观望", "减仓", "数据异常"})'
          )
          old = '        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n\n        rows: list[dict[str, Any]] = []'
          new = '        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n        decision_snapshot_id, decision_rows = self._latest_decision_rows(db)\n\n        rows: list[dict[str, Any]] = []'
          if old not in text:
              raise SystemExit('signal center build anchor missing')
          text = text.replace(old, new)
          old = '''            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2)\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "categories": self._categories(signal.state, effective, values, coefficient),\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )'''
          new = '''            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2)\n            decision_row = decision_rows.get(instrument.ts_code)\n            current_state = (\n                str(decision_row.get("grade"))\n                if decision_row and decision_row.get("grade")\n                else signal.state\n            )\n            categories = self._categories(\n                current_state,\n                effective,\n                values,\n                coefficient,\n                canonical=decision_row is not None,\n            )\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "current_state": current_state,\n                    "decision_row": decision_row,\n                    "categories": categories,\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )'''
          if old not in text:
              raise SystemExit('signal center row anchor missing')
          text = text.replace(old, new)
          old = '            "research_only": self.settings.market_provider == "mock",\n            "summary": summary,'
          new = '            "research_only": self.settings.market_provider == "mock",\n            "current_state_source": "decision_board_snapshot" if decision_rows else "signal_snapshot_fallback",\n            "decision_snapshot_id": decision_snapshot_id,\n            "curve_basis": "historical_signal_snapshots",\n            "summary": summary,'
          text = text.replace(old, new)
          text = text.replace('            "state": signal.state,', '            "state": row["current_state"],\n            "production_signal_state": signal.state,\n            "decision_board_grade": (row["decision_row"] or {}).get("grade"),')
          old = '''    def _categories(\n        self, state: str, effective: float, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        signal_config = self.strategy.get("signal", {})\n        entry = float(signal_config.get("entry_score", 68))\n        reduce_line = float(signal_config.get("reduce_score", 38))\n        categories: set[str] = set()\n        if state in OPPORTUNITY_STATES or effective >= entry:\n            categories.add("opportunity")\n        if state in RISK_STATES or effective < reduce_line:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          new = '''    def _categories(\n        self,\n        state: str,\n        effective: float,\n        values: dict[str, Any],\n        coefficient: float,\n        *,\n        canonical: bool = False,\n    ) -> set[str]:\n        categories: set[str] = set()\n        if canonical:\n            # Current front-page conclusion is canonical: never let a secondary\n            # score turn a current "减仓/观望" row into an opportunity or vice versa.\n            if state in CANONICAL_OPPORTUNITY_GRADES:\n                categories.add("opportunity")\n            if state in CANONICAL_RISK_GRADES:\n                categories.add("risk")\n        else:\n            signal_config = self.strategy.get("signal", {})\n            entry = float(signal_config.get("entry_score", 68))\n            reduce_line = float(signal_config.get("reduce_score", 38))\n            if state in OPPORTUNITY_STATES or effective >= entry:\n                categories.add("opportunity")\n            if state in RISK_STATES or effective < reduce_line:\n                categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          if old not in text:
              raise SystemExit('categories anchor missing')
          text = text.replace(old, new)
          marker = '    # ----------------------------------------------------------------- latest\n\n'
          addition = '''    @staticmethod\n    def _latest_decision_rows(db: Session) -> tuple[str | None, dict[str, dict[str, Any]]]:\n        snapshot = db.scalar(\n            select(DecisionBoardSnapshot)\n            .order_by(DecisionBoardSnapshot.generated_at.desc(), DecisionBoardSnapshot.id.desc())\n            .limit(1)\n        )\n        if snapshot is None:\n            return None, {}\n        payload = snapshot.payload_json if isinstance(snapshot.payload_json, dict) else {}\n        rows = payload.get("rows") if isinstance(payload, dict) else []\n        mapped: dict[str, dict[str, Any]] = {}\n        for row in rows or []:\n            if not isinstance(row, dict):\n                continue\n            ts_code = str(row.get("ts_code") or "").strip().upper()\n            if ts_code:\n                mapped[ts_code] = row\n        return snapshot.snapshot_id, mapped\n\n'''
          if marker not in text:
              raise SystemExit('latest marker missing')
          text = text.replace(marker, addition + marker)
          service.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_signal_center.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'from app.models import IndicatorSnapshot, Instrument, NewsItem, SignalSnapshot',
              'from app.models import DecisionBoardSnapshot, IndicatorSnapshot, Instrument, NewsItem, SignalSnapshot'
          )
          text += '''\n\ndef test_current_fronts_follow_latest_decision_board_grade(bootstrapped, db_session):\n    instrument = _instrument(db_session, "510300.SH")\n    when = datetime.now() + timedelta(days=30)\n    _attach(\n        db_session,\n        instrument,\n        when=when,\n        state="可入场",\n        score=90.0,\n        values=_indicator_values(return_20d=0.03, return_5d=0.01, rsi14=55.0),\n    )\n    db_session.flush()\n    snapshot_id = "canonical-signal-center-test"\n    db_session.add(\n        DecisionBoardSnapshot(\n            snapshot_id=snapshot_id,\n            generated_at=when + timedelta(minutes=1),\n            next_refresh_at=when + timedelta(minutes=10),\n            freshness="fresh",\n            payload_json={\n                "snapshot_id": snapshot_id,\n                "rows": [{"ts_code": instrument.ts_code, "grade": "减仓"}],\n            },\n        )\n    )\n    db_session.flush()\n\n    payload = SignalCenterService().build(db_session, coefficient=1.5)\n    assert payload["current_state_source"] == "decision_board_snapshot"\n    assert payload["decision_snapshot_id"] == snapshot_id\n    risk = [item for item in payload["fronts"]["risk"] if item["ts_code"] == instrument.ts_code]\n    opportunity = [item for item in payload["fronts"]["opportunity"] if item["ts_code"] == instrument.ts_code]\n    assert risk and risk[0]["state"] == "减仓"\n    assert risk[0]["production_signal_state"] == "可入场"\n    assert risk[0]["decision_board_grade"] == "减仓"\n    assert not opportunity\n'''
          test.write_text(text, encoding='utf-8')

          grade_test = Path('backend/tests/test_signal_grade.py')
          text = grade_test.read_text(encoding='utf-8')
          text = text.replace('assert payload["version"] == "signal-grade-v0.2.0"', 'assert payload["version"] == "signal-grade-v0.3.0"')
          text += '''\n\ndef test_reference_volume_thresholds_match_company_board():\n    service = SignalGradeService()\n    assert float(service.config["volume_expand"]) == 1.15\n    assert float(service.config["volume_contract"]) == 0.9\n'''
          grade_test.write_text(text, encoding='utf-8')
          PY
          git config user.name "reference-parity-bot"
          git config user.email "reference-parity-bot@users.noreply.github.com"
          git add config/strategy.json backend/app/services/signal_center_service.py backend/tests/test_signal_center.py backend/tests/test_signal_grade.py
          git commit -m "fix: unify current signal conclusions with decision board [reference-parity-fixed]"
          git push origin HEAD:fix/reference-board-parity-20260903-final
