name: export-v070-upgraded

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-v070-upgraded.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.7 upgrade payload
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin codex/source-export
          mkdir -p /tmp/v070
          git archive origin/codex/source-export .automation/v070 | tar -x -C /tmp
          cp -a /tmp/.automation/v070/. /tmp/v070/
          rm -rf /tmp/.automation
          sed -i 's/Pillow>=10,<13/Pillow<13,>=10/' pyproject.toml
          if ! grep -q 'version = "0.7.0"' pyproject.toml; then
            python /tmp/v070/upgrade.py
          fi
          python /tmp/v070/postfix.py
          rm -f .github/workflows/bootstrap-v070-main.yml
          rm -f .github/workflows/tag-v070-main-once.yml
          rm -f .github/workflows/export-v070-upgraded.yml
      - name: Package upgraded source
        run: |
          zip -qr /tmp/ETF-Fund-Analysis-v070-upgraded.zip . \
            -x '.git/*' '.automation/*' '.venv/*' '**/__pycache__/*' '*.pyc' '.pytest_cache/*' 'reports/*' 'backups/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ETF-Fund-Analysis-v070-upgraded
          path: /tmp/ETF-Fund-Analysis-v070-upgraded.zip
          retention-days: 1
          if-no-files-found: error
