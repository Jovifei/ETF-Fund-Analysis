name: fix-pg-shellcheck-temp

on:
  push:
    branches:
      - integration/all-features-20260902-v4

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pg-shellcheck-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/all-features-20260902-v4
      - name: Remove obsolete loop variable and self-delete
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          sed -i 's/local ready=0 i/local ready=0/' scripts/qualify_postgres.sh
          rm -f .github/workflows/fix-pg-shellcheck-temp.yml
          git add -A
          git commit -m "fix(ci): remove obsolete postgres qualifier loop variable [pg-shellcheck-fixed]"
          git push origin HEAD:integration/all-features-20260902-v4
