name: apply-reviewed-v103-provisional
on:
  push:
    branches: [fix/v103-history-research-20260909]
    paths: ['.github/workflows/apply-v103-provisional.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/fix/v103-history-research-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore independent provisional-state contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('backend/app/services/decision_board_service.py')
          s=p.read_bytes().decode('utf-8')
          sha=lambda s:hashlib.sha256(s.encode()).hexdigest()
          assert sha(s)=='3816b3ed068ebcdf74e93bc9043f8bce6529a441e2ca3681b444580d930b1871'
          s=s.replace('            indicator, forecasts, provisional = None, {}, None\n','            indicator = None\n            if blocked:\n                forecasts = {}\n')
          s=s.replace('        provisional_status = self._provisional_status(db, instrument.id, provisional, generated_at)\n','        # Missing settled indicators do not erase independently timestamped\n        # intraday research input. Incompatible history still fails closed.\n        provisional_status = ({"status": "blocked_history_contract",\n            "used_for_derived_values": False, "reason": blocked}\n            if blocked else self._provisional_status(db, instrument.id, provisional, generated_at))\n')
          s=s.replace('            freshness, data_status = "stale", "historical_price_only"\n            if quote is None and len(history) >= 2:\n','            if not provisional_status["used_for_derived_values"]:\n                freshness, data_status = "stale", "historical_price_only"\n            if not provisional_status["used_for_derived_values"] and quote is None and len(history) >= 2:\n')
          assert sha(s)=='58df8b41f9c6c8acb9a0844f8245aa376f5f1173b553dea4a0b8a2c8cea5a327'
          p.write_bytes(s.encode())
          PY
      - name: Regress original and historical contracts
        run: |
          pip install -e '.[dev]'
          pytest backend/tests/test_decision_board.py backend/tests/test_provisional_forecast_time_basis.py backend/tests/test_v103_history.py -q
          git diff --check
      - name: Commit verified application change
        run: |
          git add backend/app/services/decision_board_service.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve provisional research status independently of settled indicator availability'
          git push origin HEAD:refs/heads/fix/v103-history-research-20260909
