name: apply-scheduler-contract-test

on:
  push:
    branches: [fix/scheduler-production-resilience-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduler-production-resilience-20260903
      - name: Update intentional quote-cadence scheduler contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_market_context.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == 'assert [name for name in calls[:4]] == [']
          if len(matches) != 1:
              raise SystemExit(f'expected one scheduler call-order assertion, found {len(matches)}')
          i = matches[0]
          expected = [
              '"sync_instruments",',
              '"refresh_market_context",',
              '"refresh_signals",',
              '"refresh_news",',
              ']',
          ]
          actual = [line.strip() for line in lines[i + 1:i + 6]]
          if actual != expected:
              raise SystemExit(f'unexpected scheduler call-order block: {actual!r}')
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          lines[i] = lines[i].replace('calls[:4]', 'calls[:5]', 1)
          lines.insert(i + 2, f'{indent}"refresh_quotes",')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/apply-scheduler-contract-test.yml
      - name: Commit contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tests/test_market_context.py
          git commit -m 'test: expect intraday quote refresh before optional context'
          git push origin HEAD:fix/scheduler-production-resilience-20260903
