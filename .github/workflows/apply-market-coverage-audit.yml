name: apply-market-coverage-audit

on:
  push:
    branches: [fix/composite-provider-per-code-coverage-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composite-provider-per-code-coverage-20260903
      - name: Add requested-received-missing quote audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/market_service.py')
          t = p.read_text(encoding='utf-8')
          def one(old, new, label):
              global t
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              t = t.replace(old, new, 1)
          one(
              '        by_code = {item.ts_code: item for item in instruments}\n        timer = AuditTimer()\n',
              '        by_code = {item.ts_code: item for item in instruments}\n        requested_codes = list(by_code)\n        timer = AuditTimer()\n',
              'requested codes',
          )
          one(
              '        inserted = 0\n        realtime = 0\n',
              '        received_codes = {item.ts_code for item in records if item.ts_code in by_code}\n        missing_codes = [code for code in requested_codes if code not in received_codes]\n        inserted = 0\n        realtime = 0\n',
              'coverage calculation',
          )
          one(
              '                "degraded": degraded,\n                "run_id": run_id,\n',
              '                "degraded": degraded,\n                "requested": len(requested_codes),\n                "received": len(received_codes),\n                "missing": len(missing_codes),\n                "missing_codes": missing_codes,\n                "run_id": run_id,\n',
              'event coverage',
          )
          one(
              '            "degraded": degraded,\n        }\n\n    def purge_old_quotes',
              '            "degraded": degraded,\n            "requested": len(requested_codes),\n            "received": len(received_codes),\n            "missing": len(missing_codes),\n            "missing_codes": missing_codes,\n        }\n\n    def purge_old_quotes',
              'return coverage',
          )
          p.write_text(t, encoding='utf-8')
          PY
          git rm .github/workflows/apply-market-coverage-audit.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/market_service.py
          git commit -m 'feat: expose quote batch coverage audit'
          git push origin HEAD:fix/composite-provider-per-code-coverage-20260903
