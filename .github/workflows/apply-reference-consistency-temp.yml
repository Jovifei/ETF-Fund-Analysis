name: apply-reference-consistency-temp

on:
  push:
    branches: [fix/reference-board-signal-consistency-v2]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reference-consistency-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-signal-consistency-v2
      - name: Apply shared decision-state semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # ---- SignalGradeService: shared company-reference semantics ----
          p = Path('backend/app/services/signal_grade_service.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              'def _f(values: dict[str, Any], key: str) -> float | None:\n    return finite_or_none(values.get(key))\n',
              'def _f(values: dict[str, Any], key: str) -> float | None:\n    return finite_or_none(values.get(key))\n\n\ndef quote_percent_points_to_ratio(value: object) -> float | None:\n    """Normalize QuoteSnapshot.pct_change percentage points to decimal ratio."""\n    number = finite_or_none(value)\n    return round(number / 100.0, 12) if number is not None else None\n',
              'quote pct helper')
          s = one(s,
              '    if volume_ratio <= contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              '    if volume_ratio < contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              'volume lower boundary')
          old = '''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将金叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续"\n    else:\n        kind, label = "bear_cont", "空头延续"'''
          new = '''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "强势金叉" if dif > 0 else "弱势金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续" if dif > 0 else "修复延续"\n    else:\n        kind, label = "bear_cont", "死叉"'''
          s = one(s, old, new, 'macd labels')
          old = '''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    if rsi >= float(cfg["rsi_overbought"]):\n        label = "超买 · 回调风险高"\n    elif rsi >= float(cfg["rsi_strong"]):\n        label = "正常偏强 · 趋势中段"\n    elif rsi <= float(cfg["rsi_weak"]):\n        label = "偏弱 · 动能不足"\n    else:\n        label = "正常整理 · 趋势中段"\n    return {"value": round(rsi, 1), "label": label}'''
          new = '''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    overbought = float(cfg.get("rsi_overbought", 70))\n    strong = float(cfg.get("rsi_strong", 50))\n    oversold = float(cfg.get("rsi_oversold", 30))\n    if rsi >= overbought:\n        label = "超买 · 短期回调风险高"\n    elif rsi >= strong:\n        label = "正常偏强 · 趋势中段"\n    elif rsi >= oversold:\n        label = "偏弱 · 动能不足"\n    else:\n        label = "超卖 · 反弹概率升高"\n    return {"value": round(rsi, 1), "label": label}'''
          s = one(s, old, new, 'rsi bands')
          s = one(s,
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 60),\n        "rsi_weak": cfg.get("rsi_weak", 40),\n    })''',
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 50),\n        "rsi_oversold": cfg.get("rsi_oversold", 30),\n    })''',
              'rsi bridge')
          s = one(s,
              '            pct = finite_or_none(quote.pct_change) if quote else _f(values, "return_1d")',
              '            pct = quote_percent_points_to_ratio(quote.pct_change) if quote else _f(values, "return_1d")',
              'quote percentage normalization')
          p.write_text(s, encoding='utf-8')

          # ---- strategy thresholds ----
          p = Path('config/strategy.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          g = cfg['signal_grade']
          g.update({
              'volume_expand': 1.15,
              'volume_contract': 0.90,
              'rsi_overbought': 70,
              'rsi_strong': 50,
              'rsi_oversold': 30,
          })
          g.pop('rsi_weak', None)
          cfg['signal_grade_version'] = 'signal-grade-v0.3.0-reference'
          cfg['signal_center_version'] = 'signal-center-v0.2.0-board-consistent'
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # ---- SignalCenter: latest DecisionBoardSnapshot is current source of truth ----
          p = Path('backend/app/services/signal_center_service.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              'from app.services.holding_service import HoldingService\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank\n\nOPPORTUNITY_STATES = frozenset({"可入场", "可试探", "加仓", "小幅加仓"})\nRISK_STATES = frozenset({"减仓", "风险观察", "数据异常"})',
              'from app.services.decision_board_service import DecisionBoardService\nfrom app.services.holding_service import HoldingService\nfrom app.services.signal_grade_service import SignalGradeService\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank\n\nOPPORTUNITY_STATES = frozenset({"可加仓", "可入场", "可试探"})\nRISK_STATES = frozenset({"观望", "减仓", "数据异常"})\nLEGACY_OPPORTUNITY_STATES = frozenset({"可入场", "可试探", "加仓", "小幅加仓"})\nLEGACY_RISK_STATES = frozenset({"减仓", "风险观察", "数据异常"})',
              'center imports')
          s = one(s,
              '''    只消费已落库的 SignalSnapshot / IndicatorSnapshot / 新闻与持仓数据，\n    不改写生产信号引擎（signal-v0.4.x）的状态机与阈值；信号系数仅作用于\n    本视图的前排分类与曲线口径，属于研究展示而非操作级信号。''',
              '''    当前五档结论直接读取最新 DecisionBoardSnapshot；若尚无决策快照才回退\n    SignalGradeService，因此与主决策看板使用同一当前结论。SignalSnapshot 仅\n    保留生产分数/置信度审计，系数只影响前排排序和止盈热度，不改变当前五档。''',
              'center docstring')
          old = '''        latest_signals = self._latest_signals(db)\n        latest_indicators = self._latest_indicators(db)\n        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            signal = latest_signals.get(instrument.id)\n            if signal is None:\n                continue\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2)\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "categories": self._categories(signal.state, effective, values, coefficient),\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )'''
          new = '''        latest_signals = self._latest_signals(db)\n        latest_indicators = self._latest_indicators(db)\n        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n        decision_payload = DecisionBoardService(self.settings).read_latest(db, horizon=1) or {}\n        decision_by_code = {row["ts_code"]: row for row in decision_payload.get("rows", [])}\n        grade_payload = SignalGradeService(self.settings).build(db) if not decision_by_code else {}\n        fallback_by_code = {row["ts_code"]: row for row in grade_payload.get("rows", [])}\n        current_source = "decision_board_snapshot" if decision_by_code else "signal_grade_fallback"\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            state_row = decision_by_code.get(instrument.ts_code) or fallback_by_code.get(instrument.ts_code)\n            if state_row is None:\n                continue\n            signal = latest_signals.get(instrument.id)\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            raw_score = float(signal.score or 0) if signal is not None else 0.0\n            effective = round(raw_score * coefficient, 2)\n            board_grade = str(state_row.get("grade") or "数据异常")\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "board_grade": board_grade,\n                    "board_grade_reason": state_row.get("grade_reason"),\n                    "categories": self._categories(board_grade, values, coefficient),\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )'''
          s = one(s, old, new, 'center row source')
          s = one(s,
              '''        return {\n            "generated_at": datetime.now(self.settings.timezone),\n            "version": self.version,\n            "strategy_version": self.strategy.get("version"),\n            "coefficient": coefficient,''',
              '''        current_states = {\n            row["instrument"].ts_code: {\n                "state": row["board_grade"],\n                "reason": row.get("board_grade_reason"),\n                "production_state": row["signal"].state if row.get("signal") is not None else None,\n            }\n            for row in rows\n        }\n        return {\n            "generated_at": datetime.now(self.settings.timezone),\n            "version": self.version,\n            "strategy_version": self.strategy.get("version"),\n            "current_state_source": current_source,\n            "current_state_snapshot_id": decision_payload.get("snapshot_id") if decision_by_code else None,\n            "current_state_version": grade_payload.get("version") if not decision_by_code else "decision-board-snapshot",\n            "current_states": current_states,\n            "coefficient_semantics": "ranking_and_take_profit_only",\n            "coefficient": coefficient,''',
              'center metadata')
          s = one(s,
              '            "curve": self._curve(db, coefficient, days_limit),',
              '            "curve": self._curve(db, coefficient, days_limit),\n            "curve_source": "production_signal_history_legacy",',
              'curve metadata')
          s = one(s,
              '''    @staticmethod\n    def _opportunity_key(row: dict[str, Any]) -> tuple[float, float]:\n        return (-row["effective"], -float(row["signal"].score or 0))''',
              '''    @staticmethod\n    def _opportunity_key(row: dict[str, Any]) -> tuple[float, float]:\n        signal_score = float(row["signal"].score or 0) if row.get("signal") is not None else 0.0\n        return (-row["effective"], -signal_score)''',
              'opportunity key')
          s = one(s,
              '        signal: SignalSnapshot = row["signal"]',
              '        signal: SignalSnapshot | None = row["signal"]',
              'optional signal')
          s = one(s,
              '''            "category": category,\n            "state": signal.state,\n            "score": round(float(signal.score or 0), 2),\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2),\n            "is_actionable": bool(signal.is_actionable),''',
              '''            "category": category,\n            "state": row["board_grade"],\n            "board_grade": row["board_grade"],\n            "board_grade_reason": row.get("board_grade_reason"),\n            "production_state": signal.state if signal is not None else None,\n            "score": round(float(signal.score or 0), 2) if signal is not None else 0.0,\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2) if signal is not None else 0.0,\n            "is_actionable": bool(signal.is_actionable) if signal is not None else False,''',
              'front state')
          s = one(s,
              '            "signal_time": signal.as_of_time,\n            "expires_at": signal.expires_at,',
              '            "signal_time": signal.as_of_time if signal is not None else None,\n            "expires_at": signal.expires_at if signal is not None else None,',
              'front optional timestamps')
          old = '''    def _categories(\n        self, state: str, effective: float, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        signal_config = self.strategy.get("signal", {})\n        entry = float(signal_config.get("entry_score", 68))\n        reduce_line = float(signal_config.get("reduce_score", 38))\n        categories: set[str] = set()\n        if state in OPPORTUNITY_STATES or effective >= entry:\n            categories.add("opportunity")\n        if state in RISK_STATES or effective < reduce_line:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          new = '''    def _categories(\n        self, board_grade: str, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        categories: set[str] = set()\n        if board_grade in OPPORTUNITY_STATES:\n            categories.add("opportunity")\n        if board_grade in RISK_STATES:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories\n\n    def _legacy_categories(\n        self, state: str, effective: float, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        signal_config = self.strategy.get("signal", {})\n        entry = float(signal_config.get("entry_score", 68))\n        reduce_line = float(signal_config.get("reduce_score", 38))\n        categories: set[str] = set()\n        if state in LEGACY_OPPORTUNITY_STATES or effective >= entry:\n            categories.add("opportunity")\n        if state in LEGACY_RISK_STATES or effective < reduce_line:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          s = one(s, old, new, 'categories')
          s = one(s,
              '                for category in self._categories(snapshot.state, effective, values, coefficient):',
              '                for category in self._legacy_categories(snapshot.state, effective, values, coefficient):',
              'legacy curve')
          p.write_text(s, encoding='utf-8')

          # ---- Tests ----
          p = Path('backend/tests/test_signal_grade.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assert payload["version"] == "signal-grade-v0.2.0"', 'assert payload["version"] == "signal-grade-v0.3.0-reference"')
          s += '''\n\ndef test_company_reference_thresholds_and_quote_unit_contract():\n    from app.services.signal_grade_service import classify_rsi, classify_volume, quote_percent_points_to_ratio\n    assert classify_volume(1.15, 1.15, 0.90)["kind"] == "expand"\n    assert classify_volume(0.90, 1.15, 0.90)["kind"] == "flat"\n    assert classify_volume(0.89, 1.15, 0.90)["kind"] == "contract"\n    rsi_cfg = {"rsi_overbought": 70, "rsi_strong": 50, "rsi_oversold": 30}\n    assert classify_rsi(70, rsi_cfg)["label"].startswith("超买")\n    assert classify_rsi(50, rsi_cfg)["label"].startswith("正常偏强")\n    assert classify_rsi(30, rsi_cfg)["label"].startswith("偏弱")\n    assert classify_rsi(29.9, rsi_cfg)["label"].startswith("超卖")\n    assert quote_percent_points_to_ratio(3.8) == 0.038\n'''
          p.write_text(s, encoding='utf-8')

          p = Path('backend/tests/test_signal_center.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              'from app.services.holding_service import HoldingService',
              'from app.services.decision_board_service import DecisionBoardService\nfrom app.services.holding_service import HoldingService',
              'test decision import')
          s = s.replace('assert "可入场" in OPPORTUNITY_STATES and "可试探" in OPPORTUNITY_STATES\n    assert "减仓" in RISK_STATES and "风险观察" in RISK_STATES', 'assert "可加仓" in OPPORTUNITY_STATES and "可试探" in OPPORTUNITY_STATES\n    assert "减仓" in RISK_STATES and "观望" in RISK_STATES')
          s = s.replace('assert item["state"] in OPPORTUNITY_STATES or item["effective_score"] >= entry', 'assert item["state"] in OPPORTUNITY_STATES')
          s = s.replace('assert item["state"] in RISK_STATES or item["effective_score"] < reduce_line', 'assert item["state"] in RISK_STATES')
          old = '''def test_coefficient_is_monotonic_for_opportunity(bootstrapped, db_session):\n    counts = []\n    for coefficient in (0.5, 1.0, 1.5):\n        payload = SignalCenterService().build(db_session, coefficient=coefficient)\n        counts.append(payload["summary"]["opportunity"])\n    assert counts[0] <= counts[1] <= counts[2]\n'''
          new = '''def test_coefficient_does_not_change_current_opportunity_or_risk_membership(bootstrapped, db_session):\n    DecisionBoardService().refresh(db_session)\n    db_session.flush()\n    payloads = [SignalCenterService().build(db_session, coefficient=value) for value in (0.5, 1.0, 1.5)]\n    assert len({payload["summary"]["opportunity"] for payload in payloads}) == 1\n    assert len({payload["summary"]["risk"] for payload in payloads}) == 1\n    assert all(payload["current_state_source"] == "decision_board_snapshot" for payload in payloads)\n'''
          if old in s:
              s = s.replace(old, new, 1)
          s += '''\n\ndef test_signal_center_current_states_match_latest_decision_board_snapshot(bootstrapped, db_session):\n    build = DecisionBoardService().refresh(db_session)\n    db_session.flush()\n    board = build.payload\n    center = SignalCenterService().build(db_session)\n    expected = {row["ts_code"]: row["grade"] for row in board["rows"]}\n    actual = {code: item["state"] for code, item in center["current_states"].items()}\n    assert center["current_state_source"] == "decision_board_snapshot"\n    assert center["current_state_snapshot_id"] == board["snapshot_id"]\n    assert actual == expected\n'''
          p.write_text(s, encoding='utf-8')

          # ---- Legacy UI wording: coefficient cannot create a second current conclusion ----
          p = Path('backend/app/static/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('曲线按交易日统计各类信号数量，随系统运行逐日累积；系数变化会以当前口径重算历史分类。', '历史曲线保留生产 SignalSnapshot 历史口径，仅用于趋势回看；当前机会/风险成员以决策看板五档为准。')
          s = s.replace('<span class="eyebrow">SENSITIVITY</span><strong>信号系数</strong>', '<span class="eyebrow">RANKING SENSITIVITY</span><strong>排序 / 止盈敏感系数</strong>')
          s = s.replace('有效分 = 信号分 × 系数：&gt;1 更敏感（机会/止盈更容易入列），&lt;1 更保守。仅作用于本页研究视图，不改变生产信号引擎与阈值。', '有效分 = 生产信号分 × 系数，仅用于同类前排排序；系数只影响止盈热度阈值，不改变机会/风险成员归属。当前成员状态与决策看板五档一致。')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source changes
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/services/signal_grade_service.py backend/app/services/signal_center_service.py backend/tests/test_signal_grade.py backend/tests/test_signal_center.py backend/app/static/index.html config/strategy.json
          git commit -m "fix: unify signal center with decision-board current state [reference-consistency-applied]"
          git push origin HEAD:fix/reference-board-signal-consistency-v2
