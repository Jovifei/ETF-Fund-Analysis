name: bootstrap-v070-main

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-v070-main.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v070-main
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load guarded upgrade payload
        run: |
          git fetch origin codex/source-export
          mkdir -p /tmp/v070
          git archive origin/codex/source-export .automation/v070 | tar -x -C /tmp
          cp -a /tmp/.automation/v070/. /tmp/v070/
          rm -rf /tmp/.automation
          sed -i 's/Pillow>=10,<13/Pillow<13,>=10/' pyproject.toml
          if ! grep -q 'version = "0.7.0"' pyproject.toml; then
            python /tmp/v070/upgrade.py
          fi
          python /tmp/v070/postfix.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test, compile and secret scan
        run: |
          pytest -q | tee /tmp/pytest-v070-main.log
          python -m compileall -q backend/app
          node --check backend/app/static/app.js
          python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Migration and packaging gates
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_V070_MAIN_PRIVATE_TOKEN
          MARKET_PROVIDER: mock
          AUTO_CREATE_SCHEMA: 'false'
          DATABASE_URL: sqlite:////tmp/fund-v070-main-migration.sqlite3
          POSTGRES_PASSWORD: CHANGE_ME_V070_MAIN_DATABASE_PASSWORD
        run: |
          rm -f /tmp/fund-v070-main-migration.sqlite3
          alembic upgrade head
          alembic downgrade b3c4d5e6f7a8
          alembic upgrade head
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/aliyun/*.sh scripts/*.sh
          cp deploy/.env.production.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_DB_PASSWORD/CHANGE_ME_V070_MAIN_DATABASE_PASSWORD/' .env
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARS/CHANGE_ME_V070_MAIN_PRIVATE_TOKEN/' .env
          docker compose config >/dev/null
          rm -f .env
          docker build -f backend/Dockerfile -t china-fund-decision:v0.7.0-main .
      - name: Full Mock research smoke
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_V070_MAIN_PRIVATE_TOKEN
          MARKET_PROVIDER: mock
          ALLOW_MOCK_FALLBACK: 'false'
          AUTO_CREATE_SCHEMA: 'true'
          DATABASE_URL: sqlite:////tmp/fund-v070-main-smoke.sqlite3
          REPORTS_DIR: /tmp/fund-v070-main-reports
        run: |
          rm -f /tmp/fund-v070-main-smoke.sqlite3
          rm -rf /tmp/fund-v070-main-reports
          fund-decision bootstrap --lookback-days 520
          fund-decision run-task validate_forecasts
          fund-decision run-task backtest_rotation
          fund-decision run-task backtest_ablation
          fund-decision run-task analyze_factors
          fund-decision run-task research_capabilities
          fund-decision run-task research_global_models
      - name: Record result, remove one-shot workflow and publish
        run: |
          PASSED_LINE=$(tail -n 6 /tmp/pytest-v070-main.log | grep -E '[0-9]+ passed' | tail -n1 || true)
          {
            echo
            echo '## Main one-shot publication gate'
            echo
            echo "- pytest: ${PASSED_LINE:-passed}"
            echo '- compileall / browser JS / secret scan: passed'
            echo '- Alembic upgrade-downgrade-reupgrade: passed'
            echo '- ShellCheck / Compose / production image: passed'
            echo '- Mock forecast / corridor / factor / backtest research smoke: passed'
            echo '- real provider and ECS qualification: not executed by CI'
          } >> VALIDATION.md
          rm -f .github/workflows/bootstrap-v070-main.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('.')
          excluded={'.git','.venv','__pycache__','.pytest_cache','reports','backups','.automation'}
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              if rel.as_posix()=='FILE_MANIFEST.txt' or any(part in excluded for part in rel.parts): continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel.as_posix()}")
          Path('FILE_MANIFEST.txt').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v0.7.0): forecast corridors, factor diagnostics and release hardening'
          git push origin HEAD:main
