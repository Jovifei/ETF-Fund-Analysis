name: apply-single-decision-surface-v2

on:
  push:
    branches: [fix/single-etf-decision-surface-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-etf-decision-surface-20260903
      - name: Apply canonical UI and forecast patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              i = text.find(start)
              j = text.find(end, i + 1) if i >= 0 else -1
              if i < 0 or j < 0:
                  raise SystemExit(f'{label}: markers missing start={i} end={j}')
              return text[:i] + replacement + text[j:]

          # Routes and header: one user-facing surface.
          p = Path('backend/app/main.py'); t = p.read_text(encoding='utf-8')
          t = one(t, '@app.get("/legacy", include_in_schema=False)\ndef legacy() -> FileResponse:\n    return FileResponse(STATIC_DIR / "index.html", media_type="text/html; charset=utf-8")', '@app.get("/legacy", include_in_schema=False)\ndef legacy() -> RedirectResponse:\n    return RedirectResponse(url="/", status_code=307)', 'legacy redirect')
          t = one(t, '@app.get("/workbench/kline", include_in_schema=False)\ndef kline_stabilization() -> FileResponse:\n    return FileResponse(STATIC_DIR / "kline_stabilization.html", media_type="text/html; charset=utf-8")', '@app.get("/workbench/kline", include_in_schema=False)\ndef kline_stabilization() -> RedirectResponse:\n    return RedirectResponse(url="/", status_code=307)', 'kline redirect')
          p.write_text(t, encoding='utf-8')

          p = Path('backend/app/static/decision_board_workbuddy.html'); t = p.read_text(encoding='utf-8')
          t = one(t, '      <a class="ghost-link" href="/legacy">完整系统</a>\n', '      <span class="source-chip muted">统一决策台</span>\n', 'legacy UI link')
          t = one(t, '      <div>预测：历史相似形态研究基线 · conf 为样本一致度/支持度，不等于未来准确率；not_calibrated 时必须视为研究结果。</div>', '      <div>预测：p_up 在未校准时表示历史相似样本加权上涨占比，不等同未来概率；只有 calibration_status=calibrated 才显示为上涨概率。</div>', 'probability footer')
          p.write_text(t, encoding='utf-8')

          # Main UI: evidence-shrunk explanatory score and honest p_up label.
          p = Path('backend/app/static/decision_board_workbuddy.js'); t = p.read_text(encoding='utf-8')
          old = "function forecastScore(row={},horizon=1){const item=forecastItem(row,horizon),conf=confidenceNumber(item),expected=Number(item?.expected_return),pup=Number(item?.p_up);if(conf!==null&&conf<40)return 50;if(!Number.isFinite(expected)&&!Number.isFinite(pup))return 50;const exp=Number.isFinite(expected)?clamp(50+expected*1200,10,90):50,prob=Number.isFinite(pup)?clamp(pup*100,10,90):50;let score=exp*.62+prob*.38;if(item?.calibration_status!=='calibrated')score=Math.min(score,75);return Math.round(score);}"
          new = "function forecastScore(row={},horizon=1){const item=forecastItem(row,horizon),conf=confidenceNumber(item),expected=Number(item?.expected_return),pup=Number(item?.p_up);if(conf===null||conf<40)return 50;if(!Number.isFinite(expected)&&!Number.isFinite(pup))return 50;const exp=Number.isFinite(expected)?clamp(50+expected*1200,10,90):50,prob=Number.isFinite(pup)?clamp(pup*100,10,90):50,raw=exp*.62+prob*.38;let evidence=clamp((conf-40)/40,0,1);if(item?.calibration_status!=='calibrated')evidence*=.65;return Math.round(50+(raw-50)*evidence);}"
          t = one(t, old, new, 'forecastScore')
          detail = '''function forecastProbabilityLabel(item={}){return item?.calibration_status==='calibrated'?'上涨概率':'历史相似样本上涨占比';}\nfunction detailHtml(detail){const scoring=scoreRow(detail,state.horizon),kd=kdjInterpret(detail?.kdj),levels=detail?.support_resistance||{},src=sourceText(detail),forecasts=HORIZONS.map(h=>{const f=forecastItem(detail,h),c=confidenceNumber(f),probLabel=forecastProbabilityLabel(f);return `<div class="detail-metric"><span>${h}日预测</span><b>${pct(f?.expected_return)} · ${esc(probLabel)} ${numeric(f?.p_up)?`${Math.round(Number(f.p_up)*100)}%`:'—'}</b><small>conf ${c===null?'—':Math.round(c)} · ${esc(f?.calibration_status||'not_calibrated')}</small></div>`;}).join('');return `${detailScoreHtml(scoring)}<div class="detail-block"><h3>指标解读</h3><div class="detail-grid">${indicator('MA',detail?.ma?.label||'—',detail?.ma?.values_text||'')}${indicator('MACD',detail?.macd?.label||'—',`DIF ${fmt(detail?.macd?.dif,4)} / DEA ${fmt(detail?.macd?.dea,4)}`)}${indicator('KDJ',kd.label,kd.note)}${indicator('RSI',`RSI ${fmt(detail?.rsi?.value,1)}`,detail?.rsi?.label||'')}${indicator('量能',detail?.volume?.label||'—',`量比 ${fmt(detail?.volume?.ratio,2)}`)}${indicator('TD9',detail?.td?.label||'—','节奏参考')}</div></div><div class="detail-block"><h3>1 / 3 / 5 / 10 日研究预测</h3><div class="detail-grid">${forecasts}</div></div><div class="detail-block"><h3>支撑 / 压力 / 缠论近似 / 数据源</h3><div class="detail-grid"><div class="detail-metric"><span>最近支撑</span><b>${levelText(levels?.nearest_support)}</b></div><div class="detail-metric"><span>最近压力</span><b>${levelText(levels?.nearest_resistance)}</b></div><div class="detail-metric"><span>缠论近似</span><b>${esc(detail?.chan?.label||'—')}</b><small>${esc(detail?.chan?.detail||'')}</small></div><div class="detail-metric"><span>数据源</span><b>${esc(src.source)}</b><small>${esc(timeText(src.time))} · ${src.verified?'已验证':'未验证'}</small></div></div></div>`;}\n'''
          t = between(t, 'function detailHtml(detail){', 'function drawChart(detail){', detail, 'detailHtml')
          t = one(t, 'globalThis.WorkBuddyDecisionBoard=Object.freeze({api,ensureSession,loginAccount,logoutAccount,scoreRow,kdjInterpret,maScore,macdScore,rsiScore,tdScore,volumeScore,structureScore,forecastScore,dataScore,scoreClass,scoreLabel,pct,deltaArrow,confidenceBand,snapshotConnectionState});', 'globalThis.WorkBuddyDecisionBoard=Object.freeze({api,ensureSession,loginAccount,logoutAccount,scoreRow,kdjInterpret,maScore,macdScore,rsiScore,tdScore,volumeScore,structureScore,forecastScore,forecastProbabilityLabel,dataScore,scoreClass,scoreLabel,pct,deltaArrow,confidenceBand,snapshotConnectionState});', 'JS export')
          p.write_text(t, encoding='utf-8')

          # Compatibility 14:30 API: canonical action + canonical persisted forecasts only.
          p = Path('backend/app/services/etf_1430_service.py'); t = p.read_text(encoding='utf-8')
          t = one(t, '    DailyBar,\n    ForecastSnapshot,', '    DailyBar,\n    DecisionBoardSnapshot,\n    ForecastSnapshot,', 'DecisionBoardSnapshot import')
          t = one(t, 'from app.services.forecast_service import similarity_forecast\nfrom app.utils.feature_store import build_feature_frame, feature_columns_for_horizon\n', 'from app.services.signal_grade_service import SignalGradeService\nfrom app.utils.current_decision import resolve_current_decision\nfrom app.utils.feature_store import build_feature_frame\n', 'canonical imports')
          methods = '''    def _persisted_forecasts(self, persisted: dict[int, ForecastSnapshot]) -> dict[int, dict[str, Any]]:\n        \"\"\"Read the same persisted forecasts used by the canonical decision board.\"\"\"\n        result: dict[int, dict[str, Any]] = {}\n        for horizon_value in self.config.get(\"forecast_horizons\", [1, 3, 5, 10]):\n            horizon = int(horizon_value)\n            stored = persisted.get(horizon)\n            if stored is None:\n                result[horizon] = {\n                    \"horizon\": horizon, \"source\": \"unavailable\", \"model_version\": None,\n                    \"p_up\": None, \"historical_up_frequency\": None, \"up_probability\": None,\n                    \"p_up_semantics\": \"unavailable\", \"probability_calibrated\": False,\n                    \"expected_return\": None, \"q10\": None, \"q50\": None, \"q90\": None,\n                    \"terminal_price_q10\": None, \"terminal_price_q50\": None, \"terminal_price_q90\": None,\n                    \"path_low_price_q10\": None, \"path_low_price_q50\": None, \"path_low_price_q90\": None,\n                    \"path_high_price_q10\": None, \"path_high_price_q50\": None, \"path_high_price_q90\": None,\n                    \"support_touch_probability\": None, \"resistance_touch_probability\": None,\n                    \"sample_count\": 0, \"confidence\": 0.0, \"similarity_distance\": None,\n                    \"calibration_status\": \"not_calibrated\",\n                    \"diagnostics\": {\"reason\": \"persisted_forecast_missing\"},\n                }\n                continue\n            status = str(stored.calibration_status or \"not_calibrated\")\n            calibrated = status == \"calibrated\"\n            result[horizon] = {\n                \"horizon\": horizon, \"source\": \"persisted_forecast_snapshot\",\n                \"model_version\": stored.model_version, \"p_up\": stored.p_up,\n                \"historical_up_frequency\": None if calibrated else stored.p_up,\n                \"up_probability\": stored.p_up if calibrated else None,\n                \"p_up_semantics\": \"calibrated_up_probability\" if calibrated else \"weighted_historical_neighbor_up_frequency\",\n                \"probability_calibrated\": calibrated, \"expected_return\": stored.expected_return,\n                \"q10\": stored.q10, \"q50\": stored.q50, \"q90\": stored.q90,\n                \"terminal_price_q10\": stored.terminal_price_q10, \"terminal_price_q50\": stored.terminal_price_q50, \"terminal_price_q90\": stored.terminal_price_q90,\n                \"path_low_price_q10\": stored.path_low_price_q10, \"path_low_price_q50\": stored.path_low_price_q50, \"path_low_price_q90\": stored.path_low_price_q90,\n                \"path_high_price_q10\": stored.path_high_price_q10, \"path_high_price_q50\": stored.path_high_price_q50, \"path_high_price_q90\": stored.path_high_price_q90,\n                \"support_touch_probability\": stored.support_touch_probability, \"resistance_touch_probability\": stored.resistance_touch_probability,\n                \"sample_count\": stored.sample_count, \"confidence\": stored.confidence,\n                \"similarity_distance\": stored.similarity_distance, \"calibration_status\": status,\n                \"diagnostics\": stored.diagnostics_json or {},\n            }\n        return result\n\n    @staticmethod\n    def _latest_decision_rows(db: Session) -> tuple[str | None, dict[str, dict[str, Any]]]:\n        snapshot = db.scalar(select(DecisionBoardSnapshot).order_by(DecisionBoardSnapshot.generated_at.desc(), DecisionBoardSnapshot.id.desc()).limit(1))\n        if snapshot is None:\n            return None, {}\n        payload = snapshot.payload_json if isinstance(snapshot.payload_json, dict) else {}\n        mapped: dict[str, dict[str, Any]] = {}\n        for row in payload.get(\"rows\", []) or []:\n            if isinstance(row, dict):\n                code = str(row.get(\"ts_code\") or \"\").strip().upper()\n                if code:\n                    mapped[code] = row\n        return snapshot.snapshot_id, mapped\n\n    def _canonical_decisions(self, db: Session, instruments: list[Instrument]) -> tuple[str | None, dict[str, dict[str, Any]]]:\n        snapshot_id, board_rows = self._latest_decision_rows(db)\n        codes = {str(item.ts_code).strip().upper() for item in instruments}\n        missing = {code for code in codes if not (board_rows.get(code) or {}).get(\"grade\")}\n        grade_payload = SignalGradeService(self.settings).build(db) if missing else {}\n        grade_rows = {str(row.get(\"ts_code\") or \"\").strip().upper(): row for row in grade_payload.get(\"rows\", []) if str(row.get(\"ts_code\") or \"\").strip().upper() in missing}\n        latest_signals: dict[int, SignalSnapshot] = {}\n        for snapshot in db.scalars(select(SignalSnapshot).order_by(SignalSnapshot.as_of_time.asc())).all():\n            latest_signals[snapshot.instrument_id] = snapshot\n        result: dict[str, dict[str, Any]] = {}\n        for instrument in instruments:\n            code = str(instrument.ts_code).strip().upper()\n            board = board_rows.get(code); fallback = grade_rows.get(code); production = latest_signals.get(instrument.id)\n            resolved = resolve_current_decision(\n                decision_board_grade=(board or {}).get(\"grade\"), signal_grade_fallback=(fallback or {}).get(\"grade\"),\n                production_signal_state=production.state if production is not None else None,\n            )\n            result[code] = {\n                \"state\": resolved.state if resolved is not None else \"数据异常\",\n                \"source\": resolved.source if resolved is not None else \"unavailable\",\n                \"canonical\": resolved.canonical if resolved is not None else False,\n                \"decision_board_grade\": (board or {}).get(\"grade\"), \"signal_grade_fallback\": (fallback or {}).get(\"grade\"),\n                \"production_signal_state\": production.state if production is not None else None,\n            }\n        return snapshot_id, result\n\n'''
          t = between(t, '    def _dynamic_forecasts(\n', '    def _news(', methods, 'forecast/canonical methods')
          t = between(t, '    def _action(', '    def _scenario_candles(', '', 'remove legacy action engine')
          score = '''    @staticmethod\n    def _score_forecast(forecasts: dict[int, dict[str, Any]]) -> float:\n        weights = {1: 0.35, 3: 0.25, 5: 0.23, 10: 0.17}\n        total = 0.0; used = 0.0\n        for horizon, weight in weights.items():\n            item = forecasts.get(horizon, {}); p_up = _finite(item.get(\"p_up\")); expected = _finite(item.get(\"expected_return\")); confidence = _finite(item.get(\"confidence\"))\n            if confidence is not None and confidence <= 1:\n                confidence *= 100\n            if p_up is None and expected is None:\n                continue\n            raw = 50.0\n            if p_up is not None:\n                raw += (p_up - 0.5) * 70\n            if expected is not None:\n                raw += clamp(expected * 450, -20, 20)\n            if confidence is None or confidence < 40:\n                value = 50.0\n            else:\n                evidence = clamp((confidence - 40) / 40, 0, 1)\n                if item.get(\"calibration_status\") != \"calibrated\": evidence *= 0.65\n                value = 50.0 + (clamp(raw, 0, 100) - 50.0) * evidence\n            total += clamp(value, 0, 100) * weight; used += weight\n        return round(total / used, 2) if used else 50.0\n\n'''
          t = between(t, '    @staticmethod\n    def _score_forecast(', '    @staticmethod\n    def _score_news(', score, 'forecast score')
          t = one(t, '    def _row(self, db: Session, instrument: Instrument, *, include_chart: bool = False, user_id: int | None = None) -> dict[str, Any]:', '    def _row(self, db: Session, instrument: Instrument, *, include_chart: bool = False, user_id: int | None = None, current_decision: dict[str, Any] | None = None, decision_snapshot_id: str | None = None) -> dict[str, Any]:', 'row signature')
          t = one(t, '        forecasts = self._dynamic_forecasts(frame, persisted)\n', '        forecasts = self._persisted_forecasts(persisted)\n        if current_decision is None:\n            decision_snapshot_id, decision_map = self._canonical_decisions(db, [instrument])\n            current_decision = decision_map.get(str(instrument.ts_code).strip().upper())\n', 'persisted forecasts')
          t = one(t, '        rr = _finite(structure_metrics.get("risk_reward"))\n        action = self._action(score, rr, holding, values)\n', '        rr = _finite(structure_metrics.get("risk_reward"))\n        action = str((current_decision or {}).get("state") or "数据异常")\n', 'canonical action')
          t = one(t, '            "score": round(score, 2),\n            "action": action,\n', '            "score": round(score, 2),\n            "research_score": round(score, 2),\n            "score_semantics": "explanatory_ranking_only_not_current_decision",\n            "action": action,\n            "action_source": (current_decision or {}).get("source", "unavailable"),\n            "action_canonical": bool((current_decision or {}).get("canonical", False)),\n            "decision_snapshot_id": decision_snapshot_id,\n            "current_decision": current_decision or {"state": action, "source": "unavailable", "canonical": False},\n', 'row metadata')
          t = one(t, '        rows = [self._row(db, instrument, include_chart=False, user_id=user_id) for instrument in instruments]\n        rows.sort(key=lambda item: (float(item["score"]), item["ts_code"]), reverse=True)', '        decision_snapshot_id, decisions = self._canonical_decisions(db, instruments)\n        rows = [self._row(db, instrument, include_chart=False, user_id=user_id, current_decision=decisions.get(str(instrument.ts_code).strip().upper()), decision_snapshot_id=decision_snapshot_id) for instrument in instruments]\n        rows.sort(key=lambda item: (float(item["research_score"]), item["ts_code"]), reverse=True)', 'summary decision map')
          t = one(t, '            "historical_1430_backtest": "not_qualified",\n            "counts": dict(counts),\n', '            "historical_1430_backtest": "not_qualified",\n            "current_decision_contract": "decision_board_snapshot_then_signal_grade_then_signal_snapshot_last_resort",\n            "decision_snapshot_id": decision_snapshot_id,\n            "score_semantics": "explanatory_ranking_only_not_current_decision",\n            "counts": dict(counts),\n', 'summary metadata')
          t = one(t, '                "本页只生成研究候选，不连接券商、不创建订单。",\n', '                "兼容API的 action 与主页共用唯一 current decision；research_score 只解释和排序，不生成第二套买卖结论。",\n                "本页只生成研究结果，不连接券商、不创建订单。",\n', 'summary disclaimer')
          t = one(t, '        instrument = db.scalar(select(Instrument).where(Instrument.ts_code == ts_code.upper()))\n        return self._row(db, instrument, include_chart=True, user_id=user_id) if instrument is not None else None', '        instrument = db.scalar(select(Instrument).where(Instrument.ts_code == ts_code.upper()))\n        if instrument is None:\n            return None\n        decision_snapshot_id, decisions = self._canonical_decisions(db, [instrument])\n        return self._row(db, instrument, include_chart=True, user_id=user_id, current_decision=decisions.get(str(instrument.ts_code).strip().upper()), decision_snapshot_id=decision_snapshot_id)', 'detail decision map')
          p.write_text(t, encoding='utf-8')

          # Tests.
          p = Path('backend/tests/test_etf_1430_workbench.py'); t = p.read_text(encoding='utf-8')
          t = one(t, '    assert row["action"] in {"买入候选", "可试探", "持有/观察", "减仓候选", "回避"}\n', '    assert row["action"] in {"可加仓", "可入场", "可试探", "观望", "减仓", "数据异常"}\n    assert row["action_source"] in {"decision_board_snapshot", "signal_grade_fallback", "signal_snapshot_last_resort", "unavailable"}\n    assert row["score_semantics"] == "explanatory_ranking_only_not_current_decision"\n', 'action test')
          t = one(t, '    assert all(item["calibration_status"] == "not_calibrated" for item in row["forecasts"].values())\n', '    assert all(item["source"] in {"persisted_forecast_snapshot", "unavailable"} for item in row["forecasts"].values())\n    assert not any(item["source"] == "dynamic_similarity_research" for item in row["forecasts"].values())\n    for item in row["forecasts"].values():\n        if item["source"] == "persisted_forecast_snapshot":\n            assert item["p_up_semantics"] in {"weighted_historical_neighbor_up_frequency", "calibrated_up_probability"}\n', 'forecast test')
          old_routes = """        page = client.get(\"/workbench/1430\", follow_redirects=False)\n        assert page.status_code in {307, 308}\n        assert page.headers[\"location\"] == \"/\"\n"""
          new_routes = """        for route in (\"/workbench/1430\", \"/workbench/kline\", \"/legacy\"):\n            page = client.get(route, follow_redirects=False)\n            assert page.status_code in {307, 308}\n            assert page.headers[\"location\"] == \"/\"\n        home = client.get(\"/\")\n        assert home.status_code == 200\n        assert 'href=\"/legacy\"' not in home.text\n        assert \"统一决策台\" in home.text\n"""
          t = one(t, old_routes, new_routes, 'route test')
          p.write_text(t, encoding='utf-8')

          p = Path('backend/app/static/decision_board_workbuddy.test.js'); t = p.read_text(encoding='utf-8')
          t += "\ntest('uncalibrated p_up is labelled as historical neighbor frequency',()=>{const ui=load();assert.equal(ui.forecastProbabilityLabel({calibration_status:'not_calibrated'}),'历史相似样本上涨占比');assert.equal(ui.forecastProbabilityLabel({calibration_status:'calibrated'}),'上涨概率');});\n"
          t += "test('forecast score shrinks weak uncalibrated evidence toward neutral',()=>{const ui=load();const weak={forecasts:{'1':{expected_return:.03,p_up:.8,confidence:55,calibration_status:'not_calibrated'}}};const strong={forecasts:{'1':{expected_return:.03,p_up:.8,confidence:80,calibration_status:'calibrated'}}};assert.ok(Math.abs(ui.forecastScore(weak,1)-50)<Math.abs(ui.forecastScore(strong,1)-50));assert.equal(ui.forecastScore({forecasts:{'1':{expected_return:.08,p_up:.9,confidence:39,calibration_status:'not_calibrated'}}},1),50);});\n"
          p.write_text(t, encoding='utf-8')
          PY
          git rm .github/workflows/apply-single-decision-surface-v2.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/main.py backend/app/services/etf_1430_service.py backend/app/static/decision_board_workbuddy.html backend/app/static/decision_board_workbuddy.js backend/app/static/decision_board_workbuddy.test.js backend/tests/test_etf_1430_workbench.py
          git commit -m 'fix: enforce one ETF decision surface and forecast source'
          git push origin HEAD:fix/single-etf-decision-surface-20260903
