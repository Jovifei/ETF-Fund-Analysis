name: apply-reviewed-v104-final-ui
on:
  push:
    branches: [feat/v104-market-workspace-20260909]
    paths: ['.integration/v104-final-ui.b64']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/v104-market-workspace-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded task refresh and independent browser fixtures
        run: |
          python - <<'PY'
          import base64,lzma,hashlib,pathlib,json,subprocess
          payload=lzma.decompress(base64.b64decode(pathlib.Path('.integration/v104-final-ui.b64').read_text().strip(),validate=True))
          assert len(payload)==7722
          assert hashlib.sha256(payload).hexdigest()=='72867189c28f07d3d27d8816de97a728e2a1240d881efdd1427c54617c8d3280'
          recipe=json.loads(payload);assert len(recipe)==4
          for name,v in recipe.items():
              path=pathlib.Path(name);assert name.startswith('frontend/') and '..' not in path.parts and not path.is_symlink()
              text=path.read_bytes().decode() if path.exists() else ''
              digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
              assert digest(text)==v['before'],name
              previous=len(text)
              for start,stop,value in reversed(v['edits']):
                  assert 0<=start<=stop<=previous
                  text=text[:start]+value+text[stop:];previous=start
              assert digest(text)==v['after'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(text.encode())
          subprocess.run(['git','diff','--check'],check=True)
          PY
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run test --prefix frontend
      - name: Commit application source without workflow mutation
        run: |
          git add frontend
          git rm .integration/v104-final-ui.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v104): bound research polling and preserve in-progress forms during refresh'
          git push origin HEAD:refs/heads/feat/v104-market-workspace-20260909
