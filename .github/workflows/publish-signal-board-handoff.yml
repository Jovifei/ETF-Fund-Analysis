name: publish-signal-board-handoff

on:
  push:
    branches: [feat/screenshot-signal-board-v2]
    paths: ['.github/workflows/publish-signal-board-handoff.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify finalized branch evidence
        run: |
          test -f deployment_reports/SIGNAL_BOARD_REMOTE_VALIDATION.md
          test -f docs/LOCAL_AGENT_PROMPT_SIGNAL_BOARD.md
          test -f config/industry_board.json
          grep -q 'screenshotSignalBoard' backend/app/static/index.html
          grep -q 'def screenshot_signal_board' backend/app/api/router.py
      - name: Ensure draft PR and write handoff metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VALIDATED_SHA=$(git rev-parse HEAD)
          if gh pr view feat/screenshot-signal-board-v2 --repo Jovifei/ETF-Fund-Analysis --json number,url >/tmp/sb-pr.json 2>/dev/null; then
            :
          else
            gh pr create \
              --repo Jovifei/ETF-Fund-Analysis \
              --base main \
              --head feat/screenshot-signal-board-v2 \
              --draft \
              --title 'feat: screenshot-parity China industry ETF signal board' \
              --body 'Colorful five-level China industry ETF signal board. Remote Mock/code gates passed; real provider, PostgreSQL, ECS and visual qualification remain local tasks.'
            gh pr view feat/screenshot-signal-board-v2 --repo Jovifei/ETF-Fund-Analysis --json number,url >/tmp/sb-pr.json
          fi
          PR_NUMBER=$(python -c "import json;print(json.load(open('/tmp/sb-pr.json'))['number'])")
          PR_URL=$(python -c "import json;print(json.load(open('/tmp/sb-pr.json'))['url'])")
          mkdir -p deployment_reports
          cat > deployment_reports/SIGNAL_BOARD_REMOTE_HANDOFF.md <<EOF
          # Screenshot signal board remote handoff

          - branch: `feat/screenshot-signal-board-v2`
          - validated feature SHA before this metadata commit: `$VALIDATED_SHA`
          - draft PR: #$PR_NUMBER
          - PR URL: $PR_URL
          - base: `main`
          - remote validation: `deployment_reports/SIGNAL_BOARD_REMOTE_VALIDATION.md`
          - local Agent prompt: `docs/LOCAL_AGENT_PROMPT_SIGNAL_BOARD.md`

          The branch is intentionally not merged. Real Tushare/AKShare product qualification, active watchlist approval, PostgreSQL restore, Alibaba Cloud ECS scheduling, multi-width browser screenshots and real walk-forward calibration remain local work.
          EOF
          rm -f .github/workflows/publish-signal-board-handoff.yml
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git add -A
          git commit -m 'docs(signal-board): publish remote handoff metadata'
          git push origin HEAD:feat/screenshot-signal-board-v2
