name: apply-reviewed-v104-stage2
on:
  push:
    branches: [feat/v104-market-workspace-20260909]
    paths: ['.integration/v104-stage2/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/v104-market-workspace-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact reviewed period and research changes
        run: |
          python - <<'PY'
          import base64,lzma,hashlib,pathlib,json,subprocess
          files=sorted(pathlib.Path('.integration/v104-stage2').glob('*.txt'));assert len(files)==9
          raw=''.join(p.read_text().strip() for p in files);assert len(raw)==24428
          payload=lzma.decompress(base64.b64decode(raw,validate=True));assert len(payload)==49385
          assert hashlib.sha256(payload).hexdigest()=='0ba7ba0336445e130212dbaea0334ee6dda01cb4f51ba6fba08f377769d9d2a0'
          recipe=json.loads(payload);assert len(recipe)==25
          for name,v in recipe.items():
              path=pathlib.Path(name)
              assert name.startswith(('backend/app/','backend/tests/','frontend/'))
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              text=path.read_bytes().decode() if path.exists() else ''
              digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
              assert digest(text)==v['before'],name
              previous=len(text)
              for start,stop,value in reversed(v['edits']):
                  assert 0<=start<=stop<=previous
                  text=text[:start]+value+text[stop:];previous=start
              assert digest(text)==v['after'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(text.encode())
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Validate original-template chart and forward-research contracts
        run: |
          pip install -e '.[dev]'
          pytest backend/tests/test_v104_chart_periods.py backend/tests/test_v104_outlook.py backend/tests/test_v104_discovery.py -q
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend
          node --check backend/app/static/decision_board_workbuddy.js
          python -m compileall -q backend/app
      - name: Commit tested application changes
        run: |
          git add backend/app backend/tests/test_v104_chart_periods.py backend/tests/test_v104_outlook.py frontend
          git rm -r .integration/v104-stage2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v104): calendar candles, contextual price levels and shared day-week-month research'
          git push origin HEAD:refs/heads/feat/v104-market-workspace-20260909
