name: patch-reference-board-consistency-temp

on:
  push:
    branches: [fix/reference-board-signal-consistency-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reference-consistency-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-signal-consistency-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch shared grading semantics and signal-center source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # ---- signal grade: company-reference thresholds / labels ----
          path = Path('backend/app/services/signal_grade_service.py')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              '    if volume_ratio <= contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              '    if volume_ratio < contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              'volume lower boundary',
          )
          old_macd = '''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将金叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续"\n    else:\n        kind, label = "bear_cont", "空头延续"'''
          new_macd = '''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "强势金叉" if dif > 0 else "弱势金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续" if dif > 0 else "修复延续"\n    else:\n        kind, label = "bear_cont", "死叉"'''
          text = replace_exact(text, old_macd, new_macd, 'macd reference labels')
          old_rsi = '''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    if rsi >= float(cfg["rsi_overbought"]):\n        label = "超买 · 回调风险高"\n    elif rsi >= float(cfg["rsi_strong"]):\n        label = "正常偏强 · 趋势中段"\n    elif rsi <= float(cfg["rsi_weak"]):\n        label = "偏弱 · 动能不足"\n    else:\n        label = "正常整理 · 趋势中段"\n    return {"value": round(rsi, 1), "label": label}'''
          new_rsi = '''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    overbought = float(cfg.get("rsi_overbought", 70))\n    strong = float(cfg.get("rsi_strong", 50))\n    oversold = float(cfg.get("rsi_oversold", 30))\n    if rsi >= overbought:\n        label = "超买 · 短期回调风险高"\n    elif rsi >= strong:\n        label = "正常偏强 · 趋势中段"\n    elif rsi >= oversold:\n        label = "偏弱 · 动能不足"\n    else:\n        label = "超卖 · 反弹概率升高"\n    return {"value": round(rsi, 1), "label": label}'''
          text = replace_exact(text, old_rsi, new_rsi, 'rsi reference bands')
          text = replace_exact(
              text,
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 60),\n        "rsi_weak": cfg.get("rsi_weak", 40),\n    })''',
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 50),\n        "rsi_oversold": cfg.get("rsi_oversold", 30),\n    })''',
              'rsi config bridge',
          )
          path.write_text(text, encoding='utf-8')

          # ---- strategy thresholds from company reference ----
          path = Path('config/strategy.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          grade = cfg['signal_grade']
          grade['volume_expand'] = 1.15
          grade['volume_contract'] = 0.90
          grade['rsi_overbought'] = 70
          grade['rsi_strong'] = 50
          grade.pop('rsi_weak', None)
          grade['rsi_oversold'] = 30
          cfg['signal_grade_version'] = 'signal-grade-v0.3.0-reference'
          cfg['signal_center_version'] = 'signal-center-v0.2.0-board-consistent'
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # ---- signal center: current board grade is the only current-state source ----
          path = Path('backend/app/services/signal_center_service.py')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              'from app.services.holding_service import HoldingService\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank\n\nOPPORTUNITY_STATES = frozenset({"可入场", "可试探", "加仓", "小幅加仓"})\nRISK_STATES = frozenset({"减仓", "风险观察", "数据异常"})',
              'from app.services.holding_service import HoldingService\nfrom app.services.signal_grade_service import SignalGradeService, classify_row\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank\n\nOPPORTUNITY_STATES = frozenset({"可加仓", "可入场", "可试探"})\nRISK_STATES = frozenset({"观望", "减仓", "数据异常"})',
              'signal center imports/constants',
          )
          text = replace_exact(
              text,
              '''    只消费已落库的 SignalSnapshot / IndicatorSnapshot / 新闻与持仓数据，\n    不改写生产信号引擎（signal-v0.4.x）的状态机与阈值；信号系数仅作用于\n    本视图的前排分类与曲线口径，属于研究展示而非操作级信号。''',
              '''    当前五档结论以 SignalGradeService 为唯一来源，确保与主决策看板一致。\n    SignalSnapshot 仍保留为生产分数/置信度审计来源，但不能再单独产生第二套\n    当前“机会/风险”状态；信号系数只影响前排排序与过热研究阈值。''',
              'signal center docstring',
          )
          text = replace_exact(
              text,
              '''        latest_signals = self._latest_signals(db)\n        latest_indicators = self._latest_indicators(db)\n        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            signal = latest_signals.get(instrument.id)\n            if signal is None:\n                continue\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2)\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "categories": self._categories(signal.state, effective, values, coefficient),\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )''',
              '''        latest_signals = self._latest_signals(db)\n        latest_indicators = self._latest_indicators(db)\n        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n        grade_service = SignalGradeService(self.settings)\n        grade_payload = grade_service.build(db)\n        grade_by_code = {row["ts_code"]: row for row in grade_payload.get("rows", [])}\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            grade_row = grade_by_code.get(instrument.ts_code)\n            if grade_row is None:\n                continue\n            signal = latest_signals.get(instrument.id)\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            raw_score = float(signal.score or 0) if signal is not None else 0.0\n            effective = round(raw_score * coefficient, 2)\n            board_grade = str(grade_row.get("grade") or "数据异常")\n            rows.append(\n                {\n                    "instrument": instrument,\n                    "signal": signal,\n                    "indicator": indicator,\n                    "values": values,\n                    "effective": effective,\n                    "board_grade": board_grade,\n                    "board_grade_reason": grade_row.get("grade_reason"),\n                    "categories": self._categories(board_grade, values, coefficient),\n                    "heat": self._heat(values),\n                    "holding": holdings.get(instrument.ts_code),\n                }\n            )''',
              'signal center current rows',
          )
          text = replace_exact(
              text,
              '''            "strategy_version": self.strategy.get("version"),\n            "coefficient": coefficient,''',
              '''            "strategy_version": self.strategy.get("version"),\n            "current_state_source": "signal_grade",\n            "current_state_version": grade_payload.get("version"),\n            "coefficient_semantics": "ranking_and_take_profit_only",\n            "coefficient": coefficient,''',
              'signal center metadata',
          )
          text = replace_exact(
              text,
              '            "curve": self._curve(db, coefficient, days_limit),',
              '            "curve": self._curve(db, coefficient, days_limit),\n            "curve_source": "reconstructed_signal_grade_from_indicator_history",',
              'curve source metadata',
          )
          text = replace_exact(
              text,
              '''    @staticmethod\n    def _opportunity_key(row: dict[str, Any]) -> tuple[float, float]:\n        return (-row["effective"], -float(row["signal"].score or 0))''',
              '''    @staticmethod\n    def _opportunity_key(row: dict[str, Any]) -> tuple[float, float]:\n        signal_score = float(row["signal"].score or 0) if row.get("signal") is not None else 0.0\n        return (-row["effective"], -signal_score)''',
              'opportunity key optional signal',
          )
          text = replace_exact(
              text,
              '''        signal: SignalSnapshot = row["signal"]\n        indicator: IndicatorSnapshot | None = row["indicator"]''',
              '''        signal: SignalSnapshot | None = row["signal"]\n        indicator: IndicatorSnapshot | None = row["indicator"]''',
              'front item signal optional',
          )
          text = replace_exact(
              text,
              '''            "category": category,\n            "state": signal.state,\n            "score": round(float(signal.score or 0), 2),\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2),\n            "is_actionable": bool(signal.is_actionable),''',
              '''            "category": category,\n            "state": row["board_grade"],\n            "board_grade": row["board_grade"],\n            "board_grade_reason": row.get("board_grade_reason"),\n            "production_state": signal.state if signal is not None else None,\n            "score": round(float(signal.score or 0), 2) if signal is not None else 0.0,\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2) if signal is not None else 0.0,\n            "is_actionable": bool(signal.is_actionable) if signal is not None else False,''',
              'front item state source',
          )
          text = replace_exact(
              text,
              '''            "signal_time": signal.as_of_time,\n            "expires_at": signal.expires_at,''',
              '''            "signal_time": signal.as_of_time if signal is not None else None,\n            "expires_at": signal.expires_at if signal is not None else None,''',
              'front item optional time',
          )
          old_categories = '''    def _categories(\n        self, state: str, effective: float, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        signal_config = self.strategy.get("signal", {})\n        entry = float(signal_config.get("entry_score", 68))\n        reduce_line = float(signal_config.get("reduce_score", 38))\n        categories: set[str] = set()\n        if state in OPPORTUNITY_STATES or effective >= entry:\n            categories.add("opportunity")\n        if state in RISK_STATES or effective < reduce_line:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          new_categories = '''    def _categories(\n        self, board_grade: str, values: dict[str, Any], coefficient: float\n    ) -> set[str]:\n        categories: set[str] = set()\n        if board_grade in OPPORTUNITY_STATES:\n            categories.add("opportunity")\n        if board_grade in RISK_STATES:\n            categories.add("risk")\n        if self._is_overheated(values, coefficient):\n            categories.add("take_profit")\n        return categories'''
          text = replace_exact(text, old_categories, new_categories, 'current category source')
          old_curve_inner = '''        values_by_key = self._indicator_values_since(db, recent_days[0])\n        curve: list[dict[str, Any]] = []\n        for day in recent_days:\n            counts = {"total": 0, "opportunity": 0, "risk": 0, "take_profit": 0}\n            for instrument_id, snapshot in by_day[day].items():\n                counts["total"] += 1\n                values = values_by_key.get((instrument_id, day), {})\n                effective = float(snapshot.score or 0) * coefficient\n                for category in self._categories(snapshot.state, effective, values, coefficient):\n                    counts[category] += 1\n            curve.append({"date": day.isoformat(), **counts})\n        return curve'''
          new_curve_inner = '''        values_by_key = self._indicator_values_since(db, recent_days[0])\n        grade_service = SignalGradeService(self.settings)\n        previous_values: dict[int, dict[str, Any]] = {}\n        curve: list[dict[str, Any]] = []\n        for day in recent_days:\n            counts = {"total": 0, "opportunity": 0, "risk": 0, "take_profit": 0}\n            for instrument_id, snapshot in by_day[day].items():\n                counts["total"] += 1\n                values = values_by_key.get((instrument_id, day), {})\n                grade = classify_row(\n                    values,\n                    pct_change=finite_or_none(values.get("return_1d")),\n                    previous=previous_values.get(instrument_id),\n                    cfg=grade_service.config,\n                )["grade"]\n                for category in self._categories(grade, values, coefficient):\n                    counts[category] += 1\n                if values:\n                    previous_values[instrument_id] = values\n            curve.append({"date": day.isoformat(), **counts})\n        return curve'''
          text = replace_exact(text, old_curve_inner, new_curve_inner, 'historical grade curve')
          path.write_text(text, encoding='utf-8')

          # ---- tests ----
          path = Path('backend/tests/test_signal_grade.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"volume_expand": 1.35,\n        "volume_contract": 0.85,', '"volume_expand": 1.15,\n        "volume_contract": 0.90,')
          text += '''\n\ndef test_reference_volume_and_rsi_boundaries():\n    from app.services.signal_grade_service import classify_rsi, classify_volume\n\n    assert classify_volume(1.15, 1.15, 0.90)["kind"] == "expand"\n    assert classify_volume(0.90, 1.15, 0.90)["kind"] == "flat"\n    assert classify_volume(0.89, 1.15, 0.90)["kind"] == "contract"\n    cfg = {"rsi_overbought": 70, "rsi_strong": 50, "rsi_oversold": 30}\n    assert classify_rsi(70, cfg)["label"].startswith("超买")\n    assert classify_rsi(50, cfg)["label"].startswith("正常偏强")\n    assert classify_rsi(30, cfg)["label"].startswith("偏弱")\n    assert classify_rsi(29.9, cfg)["label"].startswith("超卖")\n\ndef test_reference_macd_labels_match_company_wording():\n    from app.services.signal_grade_service import classify_macd\n\n    strong = classify_macd({"macd_dif": .02, "macd_dea": .01, "macd_hist": .01}, {"macd_dif": 0, "macd_dea": .005, "macd_hist": -.005}, .0008)\n    weak = classify_macd({"macd_dif": -.01, "macd_dea": -.02, "macd_hist": .01}, {"macd_dif": -.03, "macd_dea": -.02, "macd_hist": -.01}, .0008)\n    assert strong["label"] == "强势金叉"\n    assert weak["label"] == "弱势金叉"\n'''
          path.write_text(text, encoding='utf-8')

          path = Path('backend/tests/test_signal_center.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert "可入场" in OPPORTUNITY_STATES and "可试探" in OPPORTUNITY_STATES\n    assert "减仓" in RISK_STATES and "风险观察" in RISK_STATES', 'assert "可加仓" in OPPORTUNITY_STATES and "可试探" in OPPORTUNITY_STATES\n    assert "减仓" in RISK_STATES and "观望" in RISK_STATES')
          text = text.replace('assert item["state"] in OPPORTUNITY_STATES or item["effective_score"] >= entry', 'assert item["state"] in OPPORTUNITY_STATES')
          text = text.replace('assert item["state"] in RISK_STATES or item["effective_score"] < reduce_line', 'assert item["state"] in RISK_STATES')
          text = text.replace('''def test_coefficient_is_monotonic_for_opportunity(bootstrapped, db_session):\n    counts = []\n    for coefficient in (0.5, 1.0, 1.5):\n        payload = SignalCenterService().build(db_session, coefficient=coefficient)\n        counts.append(payload["summary"]["opportunity"])\n    assert counts[0] <= counts[1] <= counts[2]\n''', '''def test_coefficient_does_not_change_current_board_membership(bootstrapped, db_session):\n    payloads = [SignalCenterService().build(db_session, coefficient=value) for value in (0.5, 1.0, 1.5)]\n    assert len({payload["summary"]["opportunity"] for payload in payloads}) == 1\n    assert len({payload["summary"]["risk"] for payload in payloads}) == 1\n    assert all(payload["current_state_source"] == "signal_grade" for payload in payloads)\n''')
          text += '''\n\ndef test_signal_center_current_state_follows_decision_grade_not_production_state(bootstrapped, db_session):\n    instrument = _instrument(db_session, "510300.SH")\n    when = datetime.now() + timedelta(days=10)\n    _attach(\n        db_session,\n        instrument,\n        when=when,\n        state="可入场",\n        score=82.0,\n        values=_indicator_values(\n            close=1.1, ma5=1.10, ma10=1.05, ma20=1.00, ma30=.95,\n            macd_dif=.02, macd_dea=.01, macd_hist=.01,\n            kdj_j=105, kdj_k=85, kdj_d=75, rsi14=72, volume_ratio=1.0, return_1d=.01,\n        ),\n        technical=85.0,\n    )\n    db_session.flush()\n    payload = SignalCenterService().build(db_session)\n    opportunity_codes = {item["ts_code"] for item in payload["fronts"]["opportunity"]}\n    risk_items = [item for item in payload["fronts"]["risk"] if item["ts_code"] == "510300.SH"]\n    assert "510300.SH" not in opportunity_codes\n    assert risk_items\n    assert risk_items[0]["state"] == "观望"\n    assert risk_items[0]["production_state"] == "可入场"\n'''
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install targeted test dependencies
        run: pip install -e '.[dev,market]'
      - name: Targeted tests
        run: pytest -q backend/tests/test_signal_grade.py backend/tests/test_signal_center.py
      - name: Commit patch
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/services/signal_grade_service.py backend/app/services/signal_center_service.py backend/tests/test_signal_grade.py backend/tests/test_signal_center.py config/strategy.json
          git commit -m "fix: align signal center and company reference semantics [reference-consistency-fixed]"
          git push origin HEAD:fix/reference-board-signal-consistency-v2
