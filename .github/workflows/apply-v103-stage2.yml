name: apply-reviewed-v103-stage2
on:
  push:
    branches: [fix/v103-history-research-20260909]
    paths: ['.integration/v103-stage2/manifest.json']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/fix/v103-history-research-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize checked source edits
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          root = Path('.integration/v103-stage2')
          meta = json.loads((root/'manifest.json').read_text())
          assert meta == {'parts':12,'files':46,'recipe_sha256':'30a3a465ec89eb8021f4266e3124afbc881900071495e72a3f99edca6a732515'}
          parts = [(root/str(i)).read_text() for i in range(12)]
          assert parts[9].count('vPXms/vPSad') == 1
          parts[9] = parts[9].replace('vPXms/vPSad','vPXms/vfvSad')
          raw = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == meta['recipe_sha256']
          items = json.loads(raw)
          assert len(items) == 46
          digest = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          for name, item in items.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert name.startswith(('backend/app/','backend/tests/','frontend/','scripts/','deploy/')) or name == 'pyproject.toml'
              if item['before'] is None:
                  assert not path.exists(), name
                  text = item['content']
              else:
                  text = path.read_bytes().decode('utf-8')
                  assert digest(text) == item['before'], name
                  for start, end, replacement in reversed(item['edits']):
                      assert 0 <= start <= end <= len(text), name
                      text = text[:start] + replacement + text[end:]
              assert digest(text) == item['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(text.encode('utf-8'))
              print('verified', name)
          Path('/tmp/verified-paths.json').write_text(json.dumps(list(items)))
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Test exact application files
        run: |
          pip install -e '.[dev]'
          npm ci --ignore-scripts --prefix frontend
          pytest backend/tests/test_v103_history.py backend/tests/test_v103_indexes.py backend/tests/test_v103_research.py -q
          npm run typecheck --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend
          python -m compileall -q backend/app scripts
      - name: Commit application files without workflow mutation
        run: |
          python - <<'PY'
          import json, subprocess
          subprocess.run(['git','add','--',*json.load(open('/tmp/verified-paths.json'))],check=True)
          PY
          git rm -r .integration/v103-stage2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v1.0.3): cache index candles, integrate favorites and add review workflows'
          git push origin HEAD:refs/heads/fix/v103-history-research-20260909
