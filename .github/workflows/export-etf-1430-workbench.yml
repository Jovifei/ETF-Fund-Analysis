name: export-etf-1430-workbench

on:
  push:
    branches: [feat/etf-1430-forecast-workbench]
    paths: ['.github/workflows/export-etf-1430-workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude='.git' --exclude='.github/workflows/export-etf-1430-workbench.yml' -czf /tmp/ETF-Fund-Analysis-etf-1430-workbench.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ETF-Fund-Analysis-etf-1430-workbench-source
          path: /tmp/ETF-Fund-Analysis-etf-1430-workbench.tar.gz
          retention-days: 1
