name: apply-reviewed-audit-stage-c
on:
  push:
    branches: [fix/v105-audit-blockers-20260912]
    paths: ['.integration/audit-stage-c*', '.github/workflows/apply-audit-stage-c.yml']
permissions:
  contents: write
concurrency:
  group: audit-stage-c-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/fix/v105-audit-blockers-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source patch before any application changes
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          p=pathlib.Path('.integration')
          raw=p.joinpath('audit-stage-c.part0').read_text().strip()+p.joinpath('audit-stage-c.part1').read_text().split('PSNife')[0]+p.joinpath('audit-stage-c.tail').read_text().strip()
          for old,new in [('NnWFvn0dNtttP','NnWFvn0dtttP'),('Do/f6tG73z','Do/f/6tG73z'),('+0EUF12h','+0EU12h'),('Dp71R+Nbv','Dp71+Nbv')]:
              raw=raw.replace(old,new)
          patch=gzip.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='f007d4112046d33e33e37d24fdac9e86a6f154ab0af85c82583c0ec24e9cf0b2'
          target=pathlib.Path('/tmp/audit-stage-c.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Test legacy task states and release inventory
        run: |
          pip install -e '.[dev]'
          pytest backend/tests/test_audit_release_20260913.py backend/tests/test_audit_task_status_20260913.py backend/tests/test_release_version.py backend/tests/test_pipeline.py backend/tests/test_v101_data_access.py backend/tests/test_delivery_ingestion.py -q --junitxml=/tmp/audit-stage-c.xml
          node --test backend/app/static/decision_refresh.test.js
          python -m compileall -q backend/app scripts
      - name: Commit application files and delete temporary transport
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          actual=$(git ls-remote origin refs/heads/fix/v105-audit-blockers-20260912 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add -u
          git add .github/workflows/audit-platforms.yml backend/app/static/decision_refresh.js backend/app/static/decision_refresh.test.js backend/tests/test_audit_release_20260913.py backend/tests/test_audit_task_status_20260913.py scripts/release_manifest.py
          git rm .integration/audit-stage-c* .github/workflows/apply-audit-stage-c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): align v1.0.5, track legacy job status and add Windows PostgreSQL audit gates'
          git push origin HEAD:refs/heads/fix/v105-audit-blockers-20260912
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-stage-c-tests
          path: /tmp/audit-stage-c.xml
          retention-days: 14
