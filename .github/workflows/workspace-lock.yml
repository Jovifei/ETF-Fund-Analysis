name: reviewed-workspace-lock
on:
  push:
    branches: ['feat/workspace-p0-p4-20260906']
    paths: ['.github/workflows/workspace-lock.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/workspace-p0-p4-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-p0-p4-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicitly reviewed patch versions
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('frontend/package.json'));for(const [k,v] of Object.entries({'vite':'7.3.5','vitest':'3.2.7','@playwright/test':'1.55.1'})) if(p.devDependencies[k]!==v)process.exit(1)"
      - name: Generate lock without dependency lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Commit only the generated lock on the authorized feature branch
        run: |
          git diff --exit-code -- frontend/package.json
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: lock security-reviewed Vite Vitest and Playwright patch releases'
            git push origin HEAD:refs/heads/feat/workspace-p0-p4-20260906
          fi
      - name: Audit and export the precise installed dependency set
        run: |
          mkdir -p /tmp/workspace-dependencies
          npm ci --ignore-scripts --prefix frontend
          npm audit --json --prefix frontend > /tmp/workspace-dependencies/npm-audit.json || true
          cp frontend/package.json frontend/package-lock.json /tmp/workspace-dependencies/
          tar -czf /tmp/workspace-dependencies/node-modules.tgz -C frontend node_modules
          git rev-parse HEAD > /tmp/workspace-dependencies/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-workspace-dependencies
          path: /tmp/workspace-dependencies/
          retention-days: 3
      - name: Block unresolved high severity advisories
        run: npm audit --audit-level=high --prefix frontend
