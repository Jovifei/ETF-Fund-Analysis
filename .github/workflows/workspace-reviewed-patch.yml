name: apply-reviewed-workspace-hardening
on:
  push:
    branches: ['feat/workspace-p0-p4-20260906']
    paths: ['.github/workflows/workspace-reviewed-patch.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-diff:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/workspace-p0-p4-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-p0-p4-20260906
      - name: Verify the tested patch only touches the exact reviewed files
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed={f'backend/app/workspace/{name}.py' for name in ['api','models','protocol','bridge_api','jobs','actions_api','read_model','worker']} | {'backend/tests/test_workspace_jobs.py','frontend/src/views/Overview.vue'}
          lines=Path('scripts/workspace-hardening.patch').read_text().splitlines()
          targets={line[6:] for line in lines if line.startswith('+++ b/')}
          assert targets == allowed, (targets,allowed)
          PY
          git apply --check scripts/workspace-hardening.patch
          git apply scripts/workspace-hardening.patch
          git diff --check
          git add backend/app/workspace backend/tests/test_workspace_jobs.py frontend/src/views/Overview.vue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p2,p3): apply tested horizon, bounded reads, replay protection and retry contracts'
          git push origin HEAD:refs/heads/feat/workspace-p0-p4-20260906
