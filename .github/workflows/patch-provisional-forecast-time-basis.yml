name: patch-provisional-forecast-time-basis
on:
  push:
    branches: [fix/provisional-forecast-time-basis-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provisional-forecast-time-basis-20260903
          fetch-depth: 0
      - name: Keep intraday provisional data out of EOD-neighbor forecasts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/decision_board_service.py')
          text = path.read_text(encoding='utf-8')
          for old in (
              'from app.services.forecast_service import similarity_forecast\n',
              'from app.utils.feature_store import build_feature_frame, feature_columns_for_horizon\n',
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'import anchor mismatch for {old!r}: {text.count(old)}')
              text = text.replace(old, '')

          old = '            forecast_map = dict(derived["forecasts"])\n'
          if text.count(old) != 1:
              raise SystemExit(f'provisional forecast override count={text.count(old)}')
          text = text.replace(old, '')

          old = '''        try:\n            indicators = calculate_indicators(raw, self.settings.load_strategy()["indicator"])\n            feature_frame = build_feature_frame(raw, self.settings.load_strategy()["indicator"]).frame\n            forecast_config = self.settings.load_strategy()["forecast"]\n            forecasts = {}\n            for horizon in HORIZONS:\n                result = similarity_forecast(\n                    feature_frame,\n                    horizon=horizon,\n                    neighbors=int(forecast_config.get("neighbors", 80)),\n                    minimum_neighbors=int(forecast_config.get("minimum_neighbors", 25)),\n                    maximum_confidence=float(forecast_config.get("maximum_confidence_uncalibrated", 55)),\n                    feature_columns=feature_columns_for_horizon(horizon, feature_frame.columns),\n                    conformal_alpha=float(forecast_config.get("conformal_alpha", 0.20)),\n                )\n                forecasts[str(horizon)] = {\n                    "expected_return": result.expected_return,\n                    "q10": result.q10,\n                    "q50": result.q50,\n                    "q90": result.q90,\n                    "p_up": result.p_up,\n                    "return_semantics": {"unit": "decimal_ratio", "no_unit_guessing": True},\n                    "calibration_status": "not_calibrated",\n                }\n            support_resistance = build_support_resistance(raw)\n'''
          new = '''        try:\n            indicators = calculate_indicators(raw, self.settings.load_strategy()["indicator"])\n            support_resistance = build_support_resistance(raw)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'provisional forecast derivation block count={text.count(old)}')
          text = text.replace(old, new)

          old = '            "forecasts": forecasts,\n'
          if text.count(old) != 1:
              raise SystemExit(f'derived forecast return count={text.count(old)}')
          text = text.replace(old, '')

          old = '''        return {\n            "expected_return": finite_or_none(row.expected_return) if row is not None else None,\n'''
          new = '''        return {\n            "source": "persisted_forecast_snapshot" if row is not None else "unavailable",\n            "feature_basis": "settled_daily_bars" if row is not None else "unavailable",\n            "intraday_provisional_used": False,\n            "expected_return": finite_or_none(row.expected_return) if row is not None else None,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'forecast payload anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '''            "indicator_status": {\n                "basis": "confirmed_daily_history_plus_explicit_provisional_state",\n'''
          new = '''            "indicator_status": {\n                "basis": "confirmed_daily_history_plus_explicit_provisional_state",\n                "forecast_basis": "persisted_settled_daily_snapshots",\n                "intraday_forecast_policy": "disabled_until_time_matched_intraday_history",\n'''
          if text.count(old) != 2:
              raise SystemExit(f'indicator status anchors={text.count(old)}')
          text = text.replace(old, new)

          old = '''            "reason": "temporary_confirmed_history_plus_complete_provisional_ohlcv",\n            "source_time_verified": bool(row.timestamp_verified),\n'''
          new = '''            "reason": "temporary_confirmed_history_plus_complete_provisional_ohlcv",\n            "forecast_policy": "persisted_settled_daily_only",\n            "forecast_policy_reason": "no_time_matched_intraday_neighbor_history",\n            "source_time_verified": bool(row.timestamp_verified),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'provisional policy anchor count={text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('backend/app/services/etf_1430_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    "calibration_status": "not_calibrated",\n                    "diagnostics": {"reason": "persisted_forecast_missing"},\n'''
          new = '''                    "calibration_status": "not_calibrated",\n                    "as_of_date": None, "feature_basis": "unavailable", "intraday_provisional_used": False,\n                    "diagnostics": {"reason": "persisted_forecast_missing"},\n'''
          if text.count(old) != 1:
              raise SystemExit(f'etf missing forecast anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = '''                "similarity_distance": stored.similarity_distance, "calibration_status": status,\n                "diagnostics": stored.diagnostics_json or {},\n'''
          new = '''                "similarity_distance": stored.similarity_distance, "calibration_status": status,\n                "as_of_date": stored.as_of_date.isoformat(), "feature_basis": "settled_daily_bars",\n                "intraday_provisional_used": False,\n                "diagnostics": stored.diagnostics_json or {},\n'''
          if text.count(old) != 1:
              raise SystemExit(f'etf stored forecast anchor count={text.count(old)}')
          path.write_text(text, encoding='utf-8')

          path = Path('backend/app/services/kline_stabilization_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "calibration_status": "not_calibrated", "note": "persisted forecast unavailable",\n                "source": "unavailable", "p_up_semantics": "unavailable",\n'''
          new = '''                "calibration_status": "not_calibrated", "note": "persisted forecast unavailable",\n                "source": "unavailable", "p_up_semantics": "unavailable",\n                "as_of_date": None, "feature_basis": "unavailable", "intraday_provisional_used": False,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'kline missing forecast anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = '''                "source": "persisted_forecast_snapshot",\n                "p_up_semantics": (\n'''
          new = '''                "source": "persisted_forecast_snapshot",\n                "as_of_date": stored_forecast.as_of_date.isoformat(),\n                "feature_basis": "settled_daily_bars",\n                "intraday_provisional_used": False,\n                "p_up_semantics": (\n'''
          if text.count(old) != 1:
              raise SystemExit(f'kline stored forecast anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = '''                "p_up": pattern.get("p_up"),\n                "p_up_semantics": pattern.get("p_up_semantics"),\n'''
          new = '''                "p_up": pattern.get("p_up"),\n                "p_up_semantics": pattern.get("p_up_semantics"),\n                "as_of_date": pattern.get("as_of_date"),\n                "feature_basis": pattern.get("feature_basis"),\n                "intraday_provisional_used": pattern.get("intraday_provisional_used", False),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'kline output forecast anchor count={text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('backend/app/static/decision_board_workbuddy.js')
          text = path.read_text(encoding='utf-8')
          old = '''function forecastHtml(row){const f=forecastItem(row,state.horizon),expected=f?.expected_return,conf=confidenceNumber(f),label=state.horizon===1?'明日':`${state.horizon}日`;return `<div class="forecast-cell"><strong class="${returnClass(expected)}">${pct(expected)}</strong><small>conf ${conf===null?'—':Math.round(conf)} · ${esc(confidenceBand(conf))}</small><small>${esc(label)} · ${esc(f?.calibration_status||'not_calibrated')}</small></div>`;}\n'''
          new = '''function forecastHtml(row){const f=forecastItem(row,state.horizon),expected=f?.expected_return,conf=confidenceNumber(f),label=state.horizon===1?'明日':`${state.horizon}日`,basis=f?.feature_basis==='settled_daily_bars'?`日线基准至 ${f?.as_of_date||'—'}`:(f?.feature_basis==='unavailable'?'预测基准不可用':String(f?.feature_basis||'基准未标记'));return `<div class="forecast-cell"><strong class="${returnClass(expected)}">${pct(expected)}</strong><small>conf ${conf===null?'—':Math.round(conf)} · ${esc(confidenceBand(conf))}</small><small>${esc(label)} · ${esc(f?.calibration_status||'not_calibrated')}</small><small>${esc(basis)}</small></div>`;}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'forecastHtml anchor count={text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q backend/app/services
          node --check backend/app/static/decision_board_workbuddy.js
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-provisional-forecast-time-basis.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/decision_board_service.py backend/app/services/etf_1430_service.py backend/app/services/kline_stabilization_service.py backend/app/static/decision_board_workbuddy.js .github/workflows/patch-provisional-forecast-time-basis.yml
          git commit -m 'fix: keep provisional intraday state out of EOD-neighbor forecasts'
          git push origin HEAD:fix/provisional-forecast-time-basis-20260903
