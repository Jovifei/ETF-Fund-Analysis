name: apply-canonical-current-decision

on:
  push:
    branches: [feat/canonical-current-decision-20260903]
    paths:
      - '.github/workflows/apply-canonical-current-decision.yml'
      - '.automation/canonical_current_decision/apply.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-current-decision
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python .automation/canonical_current_decision/apply.py
      - name: Keep focused membership test independent of front truncation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_signal_center.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_current_fronts_follow_latest_decision_board_grade'
          start = text.index(marker)
          target = '    payload = SignalCenterService().build(db_session, coefficient=1.5)\n'
          pos = text.index(target, start)
          replacement = (
              '    service = SignalCenterService()\n'
              '    service.config["front_size"] = 1000\n'
              '    payload = service.build(db_session, coefficient=1.5)\n'
          )
          text = text[:pos] + replacement + text[pos + len(target):]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,market]'
      - name: Focused decision-source tests
        run: |
          pytest -q backend/tests/test_current_decision.py backend/tests/test_signal_center.py
      - name: Full unit and integration tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q backend/app scripts
      - name: Validate browser JavaScript
        run: |
          node --check backend/app/static/app.js
          node --check backend/app/static/decision_board_workbuddy.js
          node --check backend/app/static/kline_stabilization.js
      - name: Decision board JavaScript tests
        run: node --test backend/app/static/decision_board_workbuddy.test.js
      - name: Basic committed-secret scan
        run: python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Validate Alembic on a clean database
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_CANONICAL_TEST_TOKEN_LONG_ENOUGH
          MARKET_PROVIDER: mock
          AUTO_CREATE_SCHEMA: 'false'
          DATABASE_URL: sqlite:////tmp/canonical-current-decision.sqlite3
        run: |
          rm -f /tmp/canonical-current-decision.sqlite3
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          alembic check
      - name: Validate shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck deploy/aliyun/*.sh scripts/*.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: CHANGE_ME_CANONICAL_DATABASE_PASSWORD
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_CANONICAL_PRIVATE_TOKEN_LONG_ENOUGH
        run: |
          cp deploy/.env.production.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_DB_PASSWORD/CHANGE_ME_CANONICAL_DATABASE_PASSWORD/' .env
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARS/CHANGE_ME_CANONICAL_PRIVATE_TOKEN_LONG_ENOUGH/' .env
          docker compose config >/dev/null
          rm -f .env
      - name: Build production image
        run: docker build -f backend/Dockerfile -t china-fund-decision:canonical-current .
      - name: Smoke production image
        run: |
          docker network create canonical-smoke
          docker run -d --name canonical-smoke-db --network canonical-smoke \
            -e POSTGRES_DB=fund_decision -e POSTGRES_USER=fundapp \
            -e POSTGRES_PASSWORD=CHANGE_ME_CANONICAL_DATABASE_PASSWORD \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec canonical-smoke-db pg_isready -U fundapp -d fund_decision >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name canonical-smoke-api --network canonical-smoke -p 127.0.0.1:18101:8000 \
            -e DATABASE_URL=postgresql+psycopg://fundapp:CHANGE_ME_CANONICAL_DATABASE_PASSWORD@canonical-smoke-db:5432/fund_decision \
            -e APP_ENV=production -e AUTH_ENABLED=true -e AUTO_CREATE_SCHEMA=false \
            -e MARKET_PROVIDER=mock -e ALLOW_MOCK_FALLBACK=false \
            -e LLM_ENABLED=false -e ANALYSIS_ENABLED=false -e OCR_MODE=disabled \
            -e OCR_TRANSIENT_ROOT=/var/lib/china-fund-decision/ocr-transient \
            --tmpfs /var/lib/china-fund-decision/ocr-transient:size=64m,mode=0700,uid=10001,gid=10001 \
            china-fund-decision:canonical-current \
            sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18101/api/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          docker logs canonical-smoke-api >&2 || true
          docker rm -f canonical-smoke-api canonical-smoke-db >/dev/null
          docker network rm canonical-smoke >/dev/null
          test "$ok" = "1"
      - name: Publish verified branch
        run: |
          rm -rf .automation/canonical_current_decision
          rm -f .github/workflows/apply-canonical-current-decision.yml
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git add -A
          git commit -m 'fix(signal-center): canonicalize current ETF decision sources'
          git push origin HEAD:feat/canonical-current-decision-20260903
