name: build-screenshot-signal-board-v3

on:
  push:
    branches: [feat/screenshot-signal-board-v2]
    paths: ['.github/workflows/build-screenshot-signal-board-v3.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot-signal-board-v3
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply integration
        run: python .automation/screenshot_signal_board/apply_existing_v2.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Tests and static checks
        run: |
          pytest -q | tee /tmp/sb3-pytest.log
          python -m compileall -q backend/app
          node --check backend/app/static/app.js
          node --check backend/app/static/screenshot_signal_board.js
          python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Migration and package checks
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_SCREENSHOT_BOARD_PRIVATE_TOKEN
          MARKET_PROVIDER: mock
          AUTO_CREATE_SCHEMA: 'false'
          DATABASE_URL: sqlite:////tmp/screenshot-board-v3-migration.sqlite3
          POSTGRES_PASSWORD: CHANGE_ME_SCREENSHOT_BOARD_DATABASE_PASSWORD
        run: |
          rm -f /tmp/screenshot-board-v3-migration.sqlite3
          alembic upgrade head
          alembic downgrade b3c4d5e6f7a8
          alembic upgrade head
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/aliyun/*.sh scripts/*.sh
          cp deploy/.env.production.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_DB_PASSWORD/CHANGE_ME_SCREENSHOT_BOARD_DATABASE_PASSWORD/' .env
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARS/CHANGE_ME_SCREENSHOT_BOARD_PRIVATE_TOKEN/' .env
          docker compose config >/dev/null
          rm -f .env
          docker build -f backend/Dockerfile -t china-fund-decision:screenshot-board-v3 .
      - name: Mock smoke
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_SCREENSHOT_BOARD_PRIVATE_TOKEN
          MARKET_PROVIDER: mock
          ALLOW_MOCK_FALLBACK: 'false'
          AUTO_CREATE_SCHEMA: 'true'
          DATABASE_URL: sqlite:////tmp/screenshot-board-v3-smoke.sqlite3
          REPORTS_DIR: /tmp/screenshot-board-v3-reports
        run: |
          rm -f /tmp/screenshot-board-v3-smoke.sqlite3
          rm -rf /tmp/screenshot-board-v3-reports
          fund-decision bootstrap --lookback-days 520
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              industry = client.get('/api/industry-board')
              signal = client.get('/api/signal-board')
          assert industry.status_code == 200, industry.text
          assert signal.status_code == 200, signal.text
          a=industry.json(); b=signal.json()
          assert a['coverage']['total'] == 31
          assert len(a['market_anchors']) == 4
          assert b['rows']
          assert b['breadth_scope'].startswith('ETF代理池')
          print({'industries':31,'anchors':4,'rows':len(b['rows'])})
          PY
          fund-decision run-task validate_forecasts
          fund-decision run-task backtest_rotation
          fund-decision run-task backtest_ablation
      - name: Commit verified branch
        run: |
          {
            echo
            echo '## Screenshot signal board branch gate'
            echo
            echo '- branch: feat/screenshot-signal-board-v2'
            echo '- pytest / compile / JavaScript / secret scan: passed'
            echo '- Alembic / ShellCheck / Compose / production image: passed'
            echo '- Mock bootstrap / industry API / signal-board API / forecast validation / backtests: passed'
            echo '- real provider, PostgreSQL, ECS and visual qualification remain local tasks'
          } >> VALIDATION.md
          rm -rf .automation/screenshot_signal_board
          rm -f .github/workflows/build-screenshot-signal-board.yml
          rm -f .github/workflows/build-screenshot-signal-board-v2.yml
          rm -f .github/workflows/build-screenshot-signal-board-v3.yml
          rm -f .github/workflows/classify-signal-board-failure.yml
          rm -f deployment_reports/SIGNAL_BOARD_CI_FAILED.md
          rm -f deployment_reports/SB_FAIL_*.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('.')
          excluded={'.git','.venv','__pycache__','.pytest_cache','reports','backups','.automation'}
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              if rel.as_posix()=='FILE_MANIFEST.txt' or any(part in excluded for part in rel.parts): continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel.as_posix()}")
          Path('FILE_MANIFEST.txt').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git add -A
          git commit -m 'feat(signal-board): screenshot-parity industry ETF dashboard'
          git push origin HEAD:feat/screenshot-signal-board-v2
