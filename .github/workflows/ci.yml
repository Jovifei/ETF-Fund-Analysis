name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,market]'
      - name: Unit and integration tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q backend/app scripts
      - name: Validate browser JavaScript
        run: |
          node --check backend/app/static/app.js
          node --check backend/app/static/decision_board_workbuddy.js
          node --check backend/app/static/boards.js
          node --check backend/app/static/etf_1430_workbench.js
          node --check backend/app/static/etf_detail.js
          node --check backend/app/static/legacy_route.js
          node --check backend/app/static/kline_stabilization.js
      - name: Decision board JavaScript tests
        run: node --test backend/app/static/decision_board_workbuddy.test.js
      - name: Basic committed-secret scan
        run: python codex/skills/fund-research/scripts/check_no_secrets.py
      - name: Validate Alembic on a clean database
        env:
          APP_ENV: test
          AUTH_ENABLED: 'false'
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_CI_TEST_TOKEN_LONG_ENOUGH
          MARKET_PROVIDER: mock
          AUTO_CREATE_SCHEMA: 'false'
          DATABASE_URL: sqlite:////tmp/fund-migration.sqlite3
        run: |
          rm -f /tmp/fund-migration.sqlite3
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          alembic check
      - name: Validate shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck deploy/aliyun/*.sh scripts/*.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: CHANGE_ME_CI_DATABASE_PASSWORD
          PRIVATE_ACCESS_TOKEN: CHANGE_ME_CI_PRIVATE_TOKEN_LONG_ENOUGH
        run: |
          cp deploy/.env.production.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_DB_PASSWORD/CHANGE_ME_CI_DATABASE_PASSWORD/' .env
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARS/CHANGE_ME_CI_PRIVATE_TOKEN_LONG_ENOUGH/' .env
          docker compose config >/dev/null
      - name: Build production image
        run: docker build -f backend/Dockerfile -t china-fund-decision:ci .
      - name: Smoke test production image
        run: |
          docker network create ci-smoke
          docker run -d --name ci-smoke-db --network ci-smoke \
            -e POSTGRES_DB=fund_decision -e POSTGRES_USER=fundapp \
            -e POSTGRES_PASSWORD=CHANGE_ME_CI_DATABASE_PASSWORD \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-smoke-db pg_isready -U fundapp -d fund_decision >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name ci-smoke-api --network ci-smoke -p 127.0.0.1:18099:8000 \
            -e DATABASE_URL=postgresql+psycopg://fundapp:CHANGE_ME_CI_DATABASE_PASSWORD@ci-smoke-db:5432/fund_decision \
            -e APP_ENV=production -e AUTH_ENABLED=true -e AUTO_CREATE_SCHEMA=false \
            -e MARKET_PROVIDER=mock -e ALLOW_MOCK_FALLBACK=false \
            -e LLM_ENABLED=false -e ANALYSIS_ENABLED=false \
            -e OCR_MODE=disabled \
            -e OCR_TRANSIENT_ROOT=/var/lib/china-fund-decision/ocr-transient \
            --tmpfs /var/lib/china-fund-decision/ocr-transient:size=64m,mode=0700,uid=10001,gid=10001 \
            china-fund-decision:ci \
            sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18099/api/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          docker logs ci-smoke-api >&2 || true
          docker rm -f ci-smoke-api ci-smoke-db >/dev/null
          docker network rm ci-smoke >/dev/null
          test "$ok" = "1"
