name: apply-task-navigation-patch

on:
  push:
    branches:
      - fix/task-driven-navigation-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_apply_task_navigation_patch.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm scripts/_apply_task_navigation_patch.py
          rm .github/workflows/_apply_task_navigation_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify navigation around user tasks"
          git push origin HEAD:fix/task-driven-navigation-20260905
