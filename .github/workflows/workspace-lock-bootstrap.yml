name: workspace-lock-bootstrap
# One-off dependency lock preparation on the user-authorized feature branch.
# Removed after the generated lockfile has been reviewed; never runs on main.
on:
  push:
    branches: ['feat/etf-workspace-vue-20260906']
    paths: ['frontend/package.json', '.github/workflows/workspace-lock-bootstrap.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'Jovifei/ETF-Fund-Analysis' && github.ref == 'refs/heads/feat/etf-workspace-vue-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Resolve pinned dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Commit only the dependency lock, without overwriting concurrent work
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch=feat/etf-workspace-vue-20260906
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: lock reviewed Vue workspace dependencies'
          git push origin "HEAD:refs/heads/$branch"
