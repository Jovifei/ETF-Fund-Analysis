name: fix-v4-shellcheck-temp

on:
  push:
    branches:
      - integration/all-features-20260902-v4

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[shellcheck-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/all-features-20260902-v4
      - name: Remove stale shellcheck variable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/qualify_postgres.sh')
          text = path.read_text()
          old = '    local ready=0 i\n'
          new = '    local ready=0\n'
          if old not in text:
              raise SystemExit('expected shellcheck declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add scripts/qualify_postgres.sh
          git commit -m "fix: remove stale shellcheck loop variable [shellcheck-fixed]"
          git push origin HEAD:integration/all-features-20260902-v4
