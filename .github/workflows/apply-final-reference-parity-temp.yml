name: apply-final-reference-parity-temp

on:
  push:
    branches: [fix/reference-board-parity-final-safe]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-reference-parity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-board-parity-final-safe
      - name: Apply final reference parity fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # ---- canonical grading semantics ----
          p=Path('backend/app/services/signal_grade_service.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"""Read-only ETF signal grading view (signal-grade-v0.1.0).', '"""Read-only ETF signal grading view (company-reference parity).', 1)
          s=one(s,
              'def _f(values: dict[str, Any], key: str) -> float | None:\n    return finite_or_none(values.get(key))\n',
              'def _f(values: dict[str, Any], key: str) -> float | None:\n    return finite_or_none(values.get(key))\n\n\ndef quote_percent_points_to_ratio(value: object) -> float | None:\n    """Normalize QuoteSnapshot.pct_change percentage points exactly once."""\n    number = finite_or_none(value)\n    return round(number / 100.0, 12) if number is not None else None\n',
              'quote pct helper')
          s=one(s,
              '    if volume_ratio <= contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              '    if volume_ratio < contract:\n        return {"label": "缩量", "kind": "contract", "ratio": round(volume_ratio, 2)}',
              'volume boundary')
          old='''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将金叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续"\n    else:\n        kind, label = "bear_cont", "空头延续"'''
          new='''    if crossed_down or (hist < 0 and dif < dea and prev_hist is not None and prev_hist >= 0):\n        kind, label = "death", "死叉"\n    elif crossed_up or (hist > 0 and dif > dea and prev_hist is not None and prev_hist <= 0):\n        kind, label = "gold", "强势金叉" if dif > 0 else "弱势金叉"\n    elif hist > 0 and (shrinking or (0 < hist <= approach and dif > dea)):\n        kind, label = "approach_death", "将死叉"\n    elif hist < 0 and (expanding or (abs(hist) <= approach and dif < dea)):\n        kind, label = "approach_gold", "将叉"\n    elif hist > 0:\n        kind, label = "bull_cont", "多头延续" if dif > 0 else "修复延续"\n    else:\n        kind, label = "bear_cont", "死叉"'''
          s=one(s,old,new,'macd labels')
          s=one(s,
              '    elif j >= float(cfg["j_overbought"]):\n        kind, label, note = "overbought", "超买", "短期过热 · 回调风险"',
              '    elif j > float(cfg["j_overbought"]):\n        kind, label, note = "overbought", "超买", "短期过热 · 回调风险"',
              'J > 100')
          s=one(s,
              '    elif j <= float(cfg["j_low"]):\n        kind, label, note = "low", "低位", "超卖 · 反弹概率升高"',
              '    elif j < float(cfg["j_low"]):\n        kind, label, note = "low", "低位", "超卖 · 反弹概率升高"',
              'J < 20')
          old='''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    if rsi >= float(cfg["rsi_overbought"]):\n        label = "超买 · 回调风险高"\n    elif rsi >= float(cfg["rsi_strong"]):\n        label = "正常偏强 · 趋势中段"\n    elif rsi <= float(cfg["rsi_weak"]):\n        label = "偏弱 · 动能不足"\n    else:\n        label = "正常整理 · 趋势中段"\n    return {"value": round(rsi, 1), "label": label}'''
          new='''def classify_rsi(rsi: float | None, cfg: dict[str, Any]) -> dict[str, Any]:\n    if rsi is None:\n        return {"value": None, "label": "RSI不足"}\n    overbought = float(cfg.get("rsi_overbought", 70))\n    strong = float(cfg.get("rsi_strong", 50))\n    oversold = float(cfg.get("rsi_oversold", 30))\n    if rsi >= overbought:\n        label = "超买 · 短期回调风险高"\n    elif rsi >= strong:\n        label = "正常偏强 · 趋势中段"\n    elif rsi >= oversold:\n        label = "偏弱 · 动能不足"\n    else:\n        label = "超卖 · 反弹概率升高"\n    return {"value": round(rsi, 1), "label": label}'''
          s=one(s,old,new,'rsi bands')
          s=one(s,
              '    bearish_macd = macd["kind"] in {"death", "approach_death"}',
              '    bearish_macd = macd["kind"] in {"death", "approach_death", "bear_cont"}',
              'bearish macd')
          s=s.replace('float(cfg.get("volume_expand", 1.35)), float(cfg.get("volume_contract", 0.85))','float(cfg.get("volume_expand", 1.15)), float(cfg.get("volume_contract", 0.90))',1)
          s=one(s,
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 60),\n        "rsi_weak": cfg.get("rsi_weak", 40),\n    })''',
              '''    rsi = classify_rsi(_f(values, "rsi14"), {\n        "rsi_overbought": cfg.get("rsi_overbought", 70),\n        "rsi_strong": cfg.get("rsi_strong", 50),\n        "rsi_oversold": cfg.get("rsi_oversold", 30),\n    })''',
              'rsi bridge')
          s=one(s,
              '            pct = finite_or_none(quote.pct_change) if quote else _f(values, "return_1d")',
              '            pct = quote_percent_points_to_ratio(quote.pct_change) if quote else _f(values, "return_1d")',
              'quote unit')
          p.write_text(s,encoding='utf-8')

          # ---- config ----
          p=Path('config/strategy.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          g=cfg['signal_grade']
          g.update({'volume_expand':1.15,'volume_contract':0.90,'rsi_overbought':70,'rsi_strong':50,'rsi_oversold':30})
          g.pop('rsi_weak',None)
          cfg['signal_grade_version']='signal-grade-v0.4.0-reference-parity'
          cfg['signal_center_version']='signal-center-v0.3.0-canonical'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # ---- DecisionBoard provenance ----
          p=Path('backend/app/services/decision_board_service.py')
          s=p.read_text(encoding='utf-8')
          anchor='            "indicator_basis": {\n'
          if anchor in s and '"grade_version": grade_payload.get("version")' not in s:
              s=s.replace(anchor,'            "grade_source": "signal_grade",\n            "grade_version": grade_payload.get("version"),\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          # ---- Signal Center: exact current-state fallback and full universe ----
          p=Path('backend/app/services/signal_center_service.py')
          s=p.read_text(encoding='utf-8')
          s=one(s,
              'from app.services.holding_service import HoldingService\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank',
              'from app.services.holding_service import HoldingService\nfrom app.services.signal_grade_service import SignalGradeService\nfrom app.utils.numbers import clamp, finite_or_none, percentile_rank',
              'center grade import')
          old='''        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n        decision_snapshot_id, decision_rows = self._latest_decision_rows(db)\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            signal = latest_signals.get(instrument.id)\n            if signal is None:\n                continue\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2)\n            decision_row = decision_rows.get(instrument.ts_code)\n            current_state = (\n                str(decision_row.get("grade"))\n                if decision_row and decision_row.get("grade")\n                else signal.state\n            )\n            categories = self._categories(\n                current_state,\n                effective,\n                values,\n                coefficient,\n                canonical=decision_row is not None,\n            )'''
          new='''        holdings = {row["ts_code"]: row for row in HoldingService().list(db, user_id=user_id) if row.get("ts_code")}\n        decision_snapshot_id, decision_rows = self._latest_decision_rows(db)\n        grade_payload = SignalGradeService(self.settings).build(db) if not decision_rows else {}\n        fallback_grades = {row["ts_code"]: row for row in grade_payload.get("rows", [])}\n\n        rows: list[dict[str, Any]] = []\n        for instrument in instruments:\n            signal = latest_signals.get(instrument.id)\n            indicator = latest_indicators.get(instrument.id)\n            values = indicator.values_json if indicator else {}\n            effective = round(float(signal.score or 0) * coefficient, 2) if signal is not None else 0.0\n            decision_row = decision_rows.get(instrument.ts_code)\n            fallback_grade = fallback_grades.get(instrument.ts_code)\n            if decision_row and decision_row.get("grade"):\n                current_state = str(decision_row["grade"])\n                canonical = True\n            elif fallback_grade and fallback_grade.get("grade"):\n                current_state = str(fallback_grade["grade"])\n                canonical = True\n            elif signal is not None:\n                current_state = signal.state\n                canonical = False\n            else:\n                continue\n            categories = self._categories(\n                current_state,\n                effective,\n                values,\n                coefficient,\n                canonical=canonical,\n            )'''
          s=one(s,old,new,'center fallback block')
          s=one(s,
              '                    "current_state": current_state,\n                    "decision_row": decision_row,',
              '                    "current_state": current_state,\n                    "decision_row": decision_row,\n                    "fallback_grade": fallback_grade,',
              'center row provenance')
          old='''        return {\n            "generated_at": datetime.now(self.settings.timezone),\n            "version": self.version,'''
          new='''        current_states = {\n            row["instrument"].ts_code: {\n                "state": row["current_state"],\n                "decision_board_grade": (row.get("decision_row") or {}).get("grade"),\n                "signal_grade_fallback": (row.get("fallback_grade") or {}).get("grade"),\n                "production_signal_state": row["signal"].state if row.get("signal") is not None else None,\n            }\n            for row in rows\n        }\n        return {\n            "generated_at": datetime.now(self.settings.timezone),\n            "version": self.version,'''
          s=one(s,old,new,'current states')
          s=one(s,
              '            "current_state_source": "decision_board_snapshot" if decision_rows else "signal_snapshot_fallback",\n            "decision_snapshot_id": decision_snapshot_id,',
              '            "current_state_source": "decision_board_snapshot" if decision_rows else "signal_grade_fallback" if fallback_grades else "signal_snapshot_last_resort",\n            "current_state_version": None if decision_rows else grade_payload.get("version"),\n            "current_states": current_states,\n            "coefficient_semantics": "ranking_and_take_profit_only_when_current_state_is_canonical",\n            "decision_snapshot_id": decision_snapshot_id,',
              'center metadata')
          s=one(s,
              '        signal: SignalSnapshot = row["signal"]',
              '        signal: SignalSnapshot | None = row["signal"]',
              'optional signal')
          s=one(s,
              '            "production_signal_state": signal.state,\n            "decision_board_grade": (row["decision_row"] or {}).get("grade"),\n            "score": round(float(signal.score or 0), 2),\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2),\n            "is_actionable": bool(signal.is_actionable),',
              '            "production_signal_state": signal.state if signal is not None else None,\n            "decision_board_grade": (row["decision_row"] or {}).get("grade"),\n            "signal_grade_fallback": (row.get("fallback_grade") or {}).get("grade"),\n            "score": round(float(signal.score or 0), 2) if signal is not None else 0.0,\n            "effective_score": row["effective"],\n            "confidence": round(float(signal.confidence or 0), 2) if signal is not None else 0.0,\n            "is_actionable": bool(signal.is_actionable) if signal is not None else False,',
              'front optional signal')
          s=s.replace('            "signal_time": signal.as_of_time,\n            "expires_at": signal.expires_at,','            "signal_time": signal.as_of_time if signal is not None else None,\n            "expires_at": signal.expires_at if signal is not None else None,',1)
          s=s.replace('        return (-row["effective"], -float(row["signal"].score or 0))','        return (-row["effective"], -(float(row["signal"].score or 0) if row.get("signal") is not None else 0.0))',1)
          p.write_text(s,encoding='utf-8')

          # ---- Main board visual wording only; keep v5 structure ----
          p=Path('backend/app/static/decision_board_workbuddy.js')
          s=p.read_text(encoding='utf-8').replace("return n>=60?'可参考':n>=40?'弱信号':'低参考';","return n>=60?'可参考':n>=40?'弱信号':'忽略';",1)
          p.write_text(s,encoding='utf-8')
          p=Path('backend/app/static/decision_board_workbuddy.html')
          s=p.read_text(encoding='utf-8').replace('<div><b>conf&lt;40</b><span>方向接近随机 · 低参考价值</span></div>','<div><b>conf&lt;40</b><span>涨跌接近随机 · 基本忽略</span></div>',1)
          p.write_text(s,encoding='utf-8')

          # ---- tests ----
          p=Path('backend/tests/test_signal_grade.py')
          s=p.read_text(encoding='utf-8').replace('assert payload["version"] == "signal-grade-v0.3.0"','assert payload["version"] == "signal-grade-v0.4.0-reference-parity"',1)
          s += '''\n\ndef test_company_reference_exact_boundaries_and_quote_contract():\n    from app.services.signal_grade_service import classify_kdj, classify_rsi, classify_volume, quote_percent_points_to_ratio\n    assert classify_volume(1.15, 1.15, 0.90)["kind"] == "expand"\n    assert classify_volume(0.90, 1.15, 0.90)["kind"] == "flat"\n    assert classify_volume(0.89, 1.15, 0.90)["kind"] == "contract"\n    cfg = {"j_overbought":100,"j_high":90,"j_low":20}\n    item=lambda j: classify_kdj({"kdj_j":j,"kdj_k":60,"kdj_d":50},None,cfg)\n    assert item(19.9)["kind"] == "low"\n    assert item(20)["kind"] == "healthy"\n    assert item(90)["kind"] == "high"\n    assert item(100)["kind"] == "high"\n    assert item(100.1)["kind"] == "overbought"\n    rsi_cfg={"rsi_overbought":70,"rsi_strong":50,"rsi_oversold":30}\n    assert classify_rsi(70,rsi_cfg)["label"].startswith("超买")\n    assert classify_rsi(50,rsi_cfg)["label"].startswith("正常偏强")\n    assert classify_rsi(30,rsi_cfg)["label"].startswith("偏弱")\n    assert classify_rsi(29.9,rsi_cfg)["label"].startswith("超卖")\n    assert quote_percent_points_to_ratio(3.8) == 0.038\n\ndef test_bear_cont_display_and_grade_are_consistent():\n    grade = assign_grade(pct_change=-.01,volume={"kind":"flat"},ma={"kind":"mixed"},macd={"kind":"bear_cont"},kdj={"j":55,"kind":"healthy","death":False},cfg={"j_add_cap":90,"stall_return":.002})\n    assert grade == "减仓"\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('backend/app/static/decision_board_workbuddy.test.js')
          s=p.read_text(encoding='utf-8')
          if "confidence reference bands" not in s:
              s += "\ntest('confidence reference bands use ignore below 40',()=>{const ui=load();assert.equal(ui.confidenceBand(60),'可参考');assert.equal(ui.confidenceBand(40),'弱信号');assert.equal(ui.confidenceBand(39),'忽略');});\n"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit parity fixes
        run: |
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add backend/app/services/signal_grade_service.py backend/app/services/decision_board_service.py backend/app/services/signal_center_service.py config/strategy.json backend/app/static/decision_board_workbuddy.js backend/app/static/decision_board_workbuddy.html backend/tests/test_signal_grade.py backend/app/static/decision_board_workbuddy.test.js
          git commit -m "fix: complete company reference parity [final-reference-parity-applied]"
          git push origin HEAD:fix/reference-board-parity-final-safe
