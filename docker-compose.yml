name: china-fund-decision

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fund_decision}
      POSTGRES_USER: ${POSTGRES_USER:-fundapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fundapp} -d ${POSTGRES_DB:-fund_decision}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/china-fund-decision/ocr-transient:size=256m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fundapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fund_decision}
      APP_ENV: ${APP_ENV:-production}
      AUTO_CREATE_SCHEMA: "false"
      TZ: Asia/Shanghai
    # Do not trust client-controlled forwarded headers. The host reverse proxy
    # is the direct peer and the application uses that stable peer for login
    # throttling rather than spoofable X-Forwarded-For values.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    volumes:
      - ./config:/app/config:ro
      - ./backend:/app/backend:ro
      - ./reports:/app/reports
      - ./backups:/app/backups
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/china-fund-decision/ocr-transient:size=256m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "app.scheduler"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fundapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fund_decision}
      APP_ENV: ${APP_ENV:-production}
      AUTO_CREATE_SCHEMA: "false"
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    # The scheduler is a background worker without an HTTP listener; the
    # curl-based HEALTHCHECK baked into the image would always fail here.
    healthcheck:
      disable: true
    volumes:
      - ./config:/app/config:ro
      - ./backend:/app/backend:ro
      - ./reports:/app/reports
      - ./backups:/app/backups
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
