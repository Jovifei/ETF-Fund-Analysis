[project]
name = "china-fund-decision"
version = "0.7.0"
description = "Private China ETF/LOF research dashboard with deterministic indicators and evidence-aware signals"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jovi private project"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "Pillow<13,>=10",
  "exchange-calendars>=4.11,<5",
]

[project.optional-dependencies]
research = [
  "alphalens-reloaded>=0.4,<1",
  "mapie>=1,<2",
  "akquant>=0.1",
  "mlforecast>=1,<2",
  "lightgbm>=4,<5",
  "catboost>=1.2,<2",
  "pyqlib>=0.9,<1",
  "riskfolio-lib>=7,<8",
  "rqalpha>=5,<6",
]
market = [
  "tushare>=1.4.20",
  "akshare>=1.17.0",
  "chanlun>=2606.73",
  "feedparser>=6.0,<7",
]
ocr = [
  "Pillow<13,>=10",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4; platform_system != 'Darwin'",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
fund-decision = "app.cli:app"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*"]
